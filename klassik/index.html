<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f4a94">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>WetterPro Klassik</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ---- css/app.css ---- */
/* WetterPro.Ma – Grundgestaltung (Farben, Kopf, Reiter, Blätter, Listen) */
:root {
  --blau:#1a5fb4; --kopf:#0f4a94; --hell:#2069c4; --gelb:#ffd633; --cyan:#5fdcf0;
  --linie:rgba(255,255,255,.22); --linie-dunkel:rgba(0,0,0,.22); --dim:#c6d5ea; --leiste:#0c2e5c;
  color-scheme:dark;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:#0b1a2e; color:#fff; font:15px/1.45 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }
button { font-family:inherit; -webkit-tap-highlight-color:transparent; color:inherit; }
button:focus-visible, input:focus-visible { outline:2px solid var(--gelb); outline-offset:1px; }
svg { display:block; }
.ic { width:24px; height:24px; }
.ic.klein { width:12px; height:12px; }
.scroll { overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.scroll::-webkit-scrollbar { display:none; }
.hair { border-bottom:0.5px solid var(--linie); }

.app { max-width:430px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--blau); position:relative; }
.screen { flex:1; }
.pane { min-height:60vh; }

/* Kopfzeile */
.top { position:sticky; top:0; z-index:15; background:var(--kopf); display:grid; grid-template-columns:48px minmax(0,1fr) 48px; align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) 4px 8px; min-height:52px; }
.top .titel { text-align:center; font-size:20px; font-weight:600; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.top .unter { text-align:center; font-size:12px; color:var(--dim); line-height:1.2; }
.top button { border:0; background:none; width:48px; height:40px; display:grid; place-items:center; cursor:pointer; }
.top .zurueck { width:auto; padding:0 6px 0 4px; display:flex; align-items:center; gap:2px; font-size:16px; justify-self:start; }

/* Reiterleiste */
.tabbar { position:sticky; bottom:0; z-index:15; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); background:var(--kopf);
  padding-bottom:env(safe-area-inset-bottom,0px); border-top:0.5px solid var(--linie); }
.tab { border:0; background:none; display:grid; justify-items:center; gap:3px; padding:8px 0 6px; cursor:pointer; color:#8fa9cc; font:500 12px -apple-system, Helvetica, Arial, sans-serif; }
.tab .ic { stroke-width:1.5; }
.tab.is-on { color:#fff; }

/* Blätter über der App (Orte, Tagesdetail) */
.blatt { position:fixed; top:0; left:0; right:0; bottom:calc(58px + env(safe-area-inset-bottom,0px)); max-width:430px; margin:0 auto; z-index:25; background:var(--blau); display:flex; flex-direction:column; }
.blatt .inhalt { flex:1; overflow:auto; position:relative; -webkit-overflow-scrolling:touch; }

/* Titelbalken innerhalb einer Fläche */
.band { background:var(--kopf); font-size:16px; padding:5px 10px; }

/* Listen */
.eintrag { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border-bottom:0.5px solid var(--linie); font-size:16px; min-height:48px; }
.zeile-liste .eintrag:nth-child(odd) { background:var(--hell); }
.eintrag span { color:var(--dim); font-size:13px; }
.eintrag .ic { color:var(--dim); flex:none; }
.eintrag button { border:0; background:none; padding:0; cursor:pointer; }
.hinweis { padding:14px; font-size:12.5px; color:var(--dim); line-height:1.45; }
.hinweis a { color:#fff; }

/* Orte-Blatt */
.suche { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--kopf); border-bottom:0.5px solid var(--linie); }
.suche input { flex:1; min-width:0; border:0.5px solid var(--linie); background:rgba(255,255,255,.08); color:#fff; font:16px inherit; padding:8px 10px; border-radius:6px; }
.suche input::placeholder { color:#8fa9cc; }
.ort-eintrag { display:grid; grid-template-columns:52px 44px minmax(0,1fr) 44px; gap:8px; align-items:center; padding:9px 10px 9px 12px; border-bottom:0.5px solid var(--linie); cursor:pointer; }
.ort-eintrag .t { color:var(--gelb); font-size:15px; line-height:1.15; }
.ort-eintrag .t span { display:block; color:#fff; font-size:11.5px; }
.ort-eintrag .sym { width:44px; height:44px; }
.ort-eintrag .n { color:var(--gelb); font-size:17px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ort-eintrag .n span { display:block; color:#fff; font-size:14px; }
.ort-eintrag .ic { color:#8fa9cc; }
.ort-eintrag.is-on .ic { color:var(--gelb); }
.zeile-liste .ort-eintrag:nth-child(odd) { background:var(--hell); }

/* Ziehen zum Aktualisieren */
.ziehen { height:0; overflow:hidden; display:flex; align-items:center; gap:18px; padding:0 22px; transition:height .18s ease-out; background:var(--blau); }
.ziehen-pfeil { width:24px; height:32px; flex:none; color:#fff; opacity:.55; transition:opacity .15s; }
.ziehen.is-bereit .ziehen-pfeil { opacity:1; }
.ziehen-text { font-size:17px; font-weight:600; line-height:1.3; }
.ziehen-datum { font-size:15px; color:#fff; line-height:1.3; }

/* Lade- und Fehlerzustand */
.laden { padding:40px 20px; text-align:center; color:var(--dim); font-size:14px; }
.fehler { margin:20px 14px; padding:12px 14px; border:0.5px solid var(--gelb); font-size:14px; line-height:1.45; }
.fehler button { margin-top:8px; border:0.5px solid #fff; background:none; padding:6px 12px; border-radius:6px; cursor:pointer; }
.snapshot-hinweis { background:var(--leiste); color:var(--dim); font-size:12px; padding:5px 12px; text-align:center; }

@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* Querformat auf dem Handy: ganze Breite nutzen, damit Karten und Listen nicht in einer schmalen Säule stehen */
@media (orientation: landscape) and (max-height: 520px) {
  .app, .blatt { max-width: none; }
}

/* ---- css/wetter.css ---- */
/* WetterPro.Ma – Reiter „Wetter" */

/* Aktuell */
.wx-aktuell { display:grid; grid-template-columns:1fr 1fr; border-bottom:0.5px solid var(--linie); }
.wx-akt-l { padding:8px 10px; border-right:0.5px solid var(--linie); position:relative; min-height:212px; }
.wx-lab { font-size:15px; }
.wx-lab span { color:var(--gelb); margin-right:8px; }
.wx-akt-l > .sym { width:118px; height:118px; margin:14px auto 0; }
.wx-temp { position:absolute; left:10px; bottom:6px; color:var(--gelb); font-size:38px; font-weight:500; letter-spacing:-1px; line-height:1.1; }
.wx-rg { position:absolute; right:8px; bottom:14px; font-size:14px; display:flex; align-items:center; gap:4px; }
.wx-rg small { font-size:11px; }
.wx-akt-r { padding:14px 10px 8px; font-size:15px; }
.wx-lage { text-align:center; margin-bottom:22px; }
.wx-row { display:flex; justify-content:space-between; line-height:1.5; }
.wx-wind { display:flex; justify-content:space-between; align-items:flex-end; margin-top:18px; }
.wx-w { display:flex; gap:6px; align-items:flex-end; }
.wx-w .windrose { width:32px; height:32px; }
.wx-w div { line-height:1.05; font-size:14px; }
.wx-w div b { font-size:19px; font-weight:400; display:block; }
.wx-boe { text-align:right; font-size:14px; line-height:1.3; }

/* Stundenspalten */
.wx-stunden { display:flex; background:#1f68c2; border-bottom:0.5px solid var(--linie); }
.wx-stunde { flex:0 0 33.34%; border-right:0.5px solid var(--linie); padding:6px 8px; }
.wx-h { font-size:15px; }
.wx-stunde .sym { width:64px; height:64px; margin:8px auto 6px; }
.wx-u { display:flex; justify-content:space-between; align-items:center; font-size:13.5px; }
.wx-u span { display:inline-flex; align-items:center; gap:3px; white-space:nowrap; }
.wx-u b { color:var(--gelb); font-size:17px; font-weight:400; }

/* Tagesliste */
.wx-tag { display:grid; grid-template-columns:62px 96px 78px minmax(0,1fr) 74px; align-items:center; padding:8px 6px 8px 11px; border-bottom:0.5px solid var(--linie); font-size:15px; cursor:pointer; }
.wx-tag:nth-child(odd) { background:var(--hell); }
.wx-tag.wx-heute { box-shadow:inset 3px 0 0 var(--gelb); }
.wx-d { color:var(--gelb); font-size:19px; font-weight:400; line-height:1.15; }
.wx-d span { display:block; color:#fff; font-size:15px; font-weight:400; }
.wx-tag > .sym { width:46px; height:46px; justify-self:center; }
.wx-tt { font-size:18px; line-height:1.2; }
.wx-tt b { display:block; color:var(--gelb); font-weight:400; }
.wx-zus { font-size:14px; line-height:1.2; padding-left:0; }
.wx-zus div { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.wx-zus b { color:var(--gelb); font-weight:400; }
.wx-zus .ic { color:var(--gelb); }
.wx-tag .wx-w, .wx-sz .wx-w { align-items:center; justify-content:flex-end; font-size:12.5px; }
.wx-tag .wx-w .windrose, .wx-sz .wx-w .windrose { width:28px; height:28px; }
.wx-tag .wx-w div b, .wx-sz .wx-w div b { font-size:17px; }

/* Tagesdetail: Nacht / Tag / Nacht */
.wx-spalten { display:grid; grid-template-columns:1fr 2fr 1fr; border-bottom:0.5px solid var(--linie); }
.wx-sp { padding:10px 8px 12px; text-align:center; }
.wx-sp + .wx-sp { border-left:0.5px solid var(--linie); }
.wx-sp-tag { background:var(--hell); }
.wx-sp-t { font-size:17px; margin-bottom:8px; }
.wx-sp-nacht .sym { width:64px; height:64px; margin:0 auto 6px; }
.wx-sp-temp { font-size:20px; margin:4px 0 8px; }
.wx-sp-tag .wx-sp-temp { color:var(--gelb); }
.wx-sp-zus { font-size:13.5px; line-height:1.5; display:inline-block; text-align:left; }
.wx-sp-zus div { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.wx-sp-zus b { color:var(--gelb); font-weight:400; }
.wx-sp-zus .ic { color:var(--gelb); }
.wx-sp-oben { display:flex; justify-content:center; align-items:center; gap:14px; }
.wx-sp-oben .sym { width:70px; height:70px; }
.wx-sp-wind { text-align:center; font-size:13px; line-height:1.1; }
.wx-sp-wind .windrose { width:40px; height:40px; margin:0 auto 2px; }
.wx-sp-wind b { font-size:17px; font-weight:400; }
.wx-sp-boe { margin-top:6px; font-size:13px; }
.wx-sp-boe b { font-size:14px; }
.wx-sp-unten { display:flex; justify-content:space-around; align-items:flex-start; gap:8px; margin-top:6px; }
.wx-sp-unten .wx-sp-temp { margin-bottom:4px; }

/* Tagesdetail: Stundenzeilen */
.wx-sz { display:grid; grid-template-columns:66px 58px 58px minmax(0,1fr) 66px; align-items:center; padding:9px 10px; border-bottom:0.5px solid var(--linie); font-size:15px; }
.wx-sz:nth-child(odd) { background:var(--hell); }
.wx-sz-z { font-size:13px; line-height:1.2; }
.wx-sz-z b { display:block; color:var(--gelb); font-weight:400; font-size:15px; }
.wx-sz > .sym { width:44px; height:44px; }
.wx-sz-temp { font-size:17px; }


/* ---- css/graphs.css ---- */
/* WetterPro.Ma – Reiter „Graphs" */
.g-scroll { padding-bottom: 8px; overflow-y: hidden; overscroll-behavior-x: contain; }
.g-scroll .band { position: sticky; left: 0; width: 100%; }
.g-row { display: flex; width: max-content; }
.g-yax { position: sticky; left: 0; width: 34px; flex: none; background: var(--blau); z-index: 2; border-right: 0.5px solid var(--linie); }
.g-yax svg { display: block; }
.g-info { display: grid; place-items: center; color: #fff; }
.g-info .ic { width: 22px; height: 22px; stroke-width: 1.5; }
.g-tag { width: 105px; flex: none; text-align: center; padding: 6px 0 4px; border-right: 0.5px solid var(--linie); line-height: 1.2; }
.g-tag b { display: block; color: var(--gelb); font-size: 17px; font-weight: 600; }
.g-tag span { font-size: 14px; }
.g-icon { width: 105px; flex: none; text-align: center; padding: 6px 4px 8px; border-right: 0.5px solid var(--linie); font-size: 12.5px; line-height: 1.2; }
.g-icon .sym { width: 52px; height: 52px; margin: 0 auto 4px; }
.g-icon span { display: block; }
.g-text { width: 105px; flex: none; text-align: center; padding: 8px 0 10px; border-right: 0.5px solid var(--linie); font-size: 16px; }
.g-text b { color: var(--gelb); font-weight: 400; margin-left: 8px; }
.g-text.g-cy { color: var(--cyan); font-size: 14px; }
.g-text.g-cy span { color: var(--dim); margin-left: 8px; }
.g-text.g-so { font-size: 13px; line-height: 1.5; text-align: left; padding-left: 12px; }
.g-text.g-so div { display: flex; align-items: center; gap: 6px; }
.g-text.g-so i { display: inline-flex; width: 14px; justify-content: center; color: var(--gelb); font-style: normal; flex: none; }
.g-text.g-so i.g-uv { width: auto; font-size: 11px; margin-right: 2px; }
.g-text.g-so .ic { width: 13px; height: 13px; }
.g-wz { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 14px; line-height: 1.2; }
.g-wz .windrose { width: 34px; height: 34px; }
.g-wz div { text-align: left; }
.g-wz span { color: var(--dim); }

/* ---- ../gemeinsam/wpkarte.css ---- */
/* WetterKarte – gemeinsamer Kartenbaustein (Reiter „Karten" und „Rad/Sat").
   Farben über Variablen, Vorgabe = WeatherPro-Blau. Eine App setzt die --wk-* am Container oder an :root um. */
.wk {
  --wk-leiste: var(--kopf, #0f4a94);        /* Ebenenleiste rechts */
  --wk-leiste-an: var(--hell, #2069c4);     /* aktiver Knopf */
  --wk-zeit: var(--leiste, #0c2e5c);        /* Zeitleiste unten */
  --wk-text: #fff;
  --wk-still: var(--dim, #c6d5ea);
  --wk-akzent: var(--gelb, #ffd633);
  --wk-rand: var(--linie, rgba(255,255,255,.22));
  --wk-hoehe: calc(100dvh - 190px);
  display: flex; flex-direction: column; height: var(--wk-hoehe); min-height: 340px; color: var(--wk-text);
  font-variant-numeric: tabular-nums; position: relative;
}
.wk-oben { flex: 1; min-height: 0; display: flex; }
.wk-karte { flex: 1; min-width: 0; position: relative; background: #7fa7c9; }
.wk-karte .leaflet-container { width: 100%; height: 100%; background: #7fa7c9; font: inherit; }
.wk-karte .leaflet-container a { color: inherit; }

/* Ebenenleiste rechts */
.wk-leiste { width: 56px; flex: none; display: flex; flex-direction: column; background: var(--wk-leiste); border-left: 0.5px solid var(--wk-rand); overflow-y: auto; scrollbar-width: none; }
.wk-leiste::-webkit-scrollbar { display: none; }
.wk-knopf { width: 56px; height: 52px; flex: none; border: 0; border-bottom: 0.5px solid var(--wk-rand); background: none; display: grid; place-items: center; cursor: pointer; color: var(--wk-still); -webkit-tap-highlight-color: transparent; }
.wk-knopf svg { width: 26px; height: 26px; display: block; }
.wk-knopf.is-on { background: var(--wk-leiste-an); color: var(--wk-text); }
.wk-knopf:disabled { opacity: .35; cursor: default; }
.wk-knopf:focus-visible { outline: 2px solid var(--wk-akzent); outline-offset: -3px; }
.wk-trenner { flex: 1; min-height: 8px; }

/* Zeitleiste unten */
.wk-zeit { background: var(--wk-zeit); padding: 6px 10px 10px; border-top: 0.5px solid var(--wk-rand); }
.wk-regler { display: flex; align-items: center; gap: 2px; }
.wk-tk { width: 40px; height: 40px; border: 0; background: none; color: var(--wk-text); display: grid; place-items: center; cursor: pointer; flex: none; -webkit-tap-highlight-color: transparent; }
.wk-tk svg { width: 18px; height: 18px; display: block; }
.wk-tk:disabled { opacity: .35; }
.wk-spur { flex: 1; min-width: 0; position: relative; padding: 0 2px 30px; }
.wk-range { width: 100%; margin: 0; display: block; accent-color: #fff; height: 28px; }
.wk-ticks { position: absolute; left: 10px; right: 10px; bottom: 16px; height: 14px; font-size: 10.5px; color: var(--wk-still); pointer-events: none; }
.wk-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.wk-ticks span::before { content: ""; display: block; width: 0.5px; height: 4px; background: var(--wk-still); margin: 0 auto 1px; }
.wk-tage { position: absolute; left: 10px; right: 10px; bottom: 0; height: 14px; font-size: 11px; font-weight: 600; color: var(--wk-text); pointer-events: none; }
.wk-tage span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.wk-tage span.is-heute { color: var(--wk-akzent); }
.wk-lade { position: absolute; right: 8px; top: 44px; z-index: 500; font-size: 11.5px; color: var(--wk-still); background: rgba(0,0,0,.45); padding: 2px 7px; pointer-events: none; }

/* Marken */
.wk-mk { background: none; border: 0; }
.wk-marke { position: absolute; left: 0; top: 0; font-size: 12.5px; line-height: 1.15; white-space: nowrap; color: #fff;
  text-shadow: 0 0 3px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.7); pointer-events: none; }
.wk-marke i { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 0.5px solid rgba(0,0,0,.6); box-shadow: 0 0 3px rgba(0,0,0,.6); }
.wk-marke .wk-name { position: absolute; left: 8px; top: -8px; font-weight: 500; }
.wk-marke .wk-w { position: absolute; right: 7px; top: -34px; display: flex; align-items: center; gap: 1px; }
.wk-marke .wk-w svg { width: 34px; height: 34px; display: block; filter: drop-shadow(0 0 2px rgba(0,0,0,.9)); }
.wk-marke .wk-w b { font-size: 14px; font-weight: 500; }
.wk-marke.is-hier i { width: 12px; height: 12px; left: -6px; top: -6px; background: var(--wk-akzent); box-shadow: 0 0 0 3px rgba(255,214,51,.3); }
.wk-marke.is-hier .wk-name { color: var(--wk-akzent); font-weight: 600; font-size: 13.5px; }
.wk-marke.is-hier .wk-w { top: -38px; }
.wk-marke.is-hier .wk-w svg { width: 40px; height: 40px; }
.wk-marke.is-hier .wk-w b { font-size: 16px; }
.wk-ohne-wetter .wk-marke .wk-w { display: none; }

/* Flächen und Bilder */
.wk-flaeche { image-rendering: auto; }
.wk-basis-bild { image-rendering: auto; }

/* Quellen, Hinweise, Legende */
.wk-quelle { position: absolute; left: 6px; right: 6px; bottom: 4px; z-index: 500; font-size: 10px; line-height: 1.25; letter-spacing: .04em; color: rgba(255,255,255,.85); text-shadow: 0 0 3px rgba(0,0,0,.95); pointer-events: none; }
.wk-hinweis { position: absolute; left: 12px; right: 12px; bottom: 22px; z-index: 500; text-align: center; font-size: 12.5px; line-height: 1.4; color: #fff; padding: 6px 10px; background: rgba(11,26,46,.8); pointer-events: none; }
.wk-legende { position: absolute; left: 6px; top: 6px; z-index: 500; font-size: 10.5px; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.95); pointer-events: none; display: flex; align-items: center; gap: 6px; }
.wk-legende i { display: block; width: 110px; height: 8px; border: 0.5px solid rgba(0,0,0,.5); }
.wk-titel { position: absolute; right: 6px; top: 6px; z-index: 500; font-size: 11px; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.95); pointer-events: none; text-align: right; line-height: 1.25; }
.wk-titel b { display: block; font-size: 12.5px; }

/* Leaflet-Feinheiten */
.wk .leaflet-control-attribution { display: none; }
.wk .leaflet-marker-icon { transition: none; }
.wk .leaflet-image-layer { pointer-events: none; }

/* ---- css/karten.css ---- */
/* WetterPro Klassik – Reiter „Karten" und „Rad/Sat": Höhe des Kartenbausteins (Kopfzeile 52 px + Reiterleiste 58 px).
   Der Baustein sitzt direkt auf der Reiterfläche (.pane bekommt die Klasse .wk). */
.pane[data-pane="karten"], .pane[data-pane="radsat"] { min-height:0; }
.pane[data-pane="karten"].wk, .pane[data-pane="radsat"].wk {
  --wk-hoehe: calc(100dvh - 52px - 58px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
@supports not (height: 100dvh) {
  .pane[data-pane="karten"].wk, .pane[data-pane="radsat"].wk { --wk-hoehe: calc(100vh - 110px); }
}
/* Wenn der Hinweis „Gespeicherter Stand" über der Fläche steht, wird die Karte um dessen Höhe kürzer */
body:has(#snapshot-hinweis:not([hidden])) .pane[data-pane="karten"].wk,
body:has(#snapshot-hinweis:not([hidden])) .pane[data-pane="radsat"].wk {
  --wk-hoehe: calc(100dvh - 52px - 58px - 26px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}

</style>
</head>

<script>
/* ---- js/symbole.js ---- */
/* WetterPro.Ma – einfarbige Strichsymbole (weiß), Windrose und kleine Zeichen. */
(function (global) {

  // ---- Farbige Symbole nach WeatherPro-Vorbild ----

  var DEFS = '<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="wp-defs"><defs>' +
    '<linearGradient id="wpg-wolke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f4f6f8"/><stop offset="1" stop-color="#cfd6de"/></linearGradient>' +
    '<linearGradient id="wpg-wolke2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e8ee"/><stop offset="1" stop-color="#aab4bf"/></linearGradient>' +
    '<radialGradient id="wpg-sonne" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3a8"/><stop offset=".6" stop-color="#ffd83a"/><stop offset="1" stop-color="#f7c21e"/></radialGradient>' +

    '<filter id="wpf-glut" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>' +
    '<filter id="wpf-schatten" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity=".35"/></filter>' +
    '<clipPath id="wpc-mond"><circle cx="32" cy="32" r="15"/></clipPath>' +

  // Zwölfzackige Sonne wie im Original: Stern aus 12 Spitzen, gelb mit orangem Rand und Schein.

    var pts = [];

  }
  function mond(dx, dy, sc) {
    // Mond ein Viertel größer als ursprünglich gezeichnet, Mitte bleibt bei 32/32 (Stephans Wunsch 30.09.)
    return '<g transform="translate(' + (dx - 8 * sc).toFixed(1) + ' ' + (dy - 8 * sc).toFixed(1) + ') scale(' + (sc * 1.25).toFixed(3) + ')"><circle cx="32" cy="32" r="15" fill="url(#wpg-mond)" stroke="#8e98a3" stroke-width=".8"/>' +

    var mitte = stundenDesTages(d, tag.datum, 6, 18);
    var nach = stundenDesTages(d, tag.datum, 18, 24);
    var alle = stundenDesTages(d, tag.datum, 0, 24);
    var html = '<div class="wx-detail">' +
      '<div class="wx-spalten">' + spalteNacht('Nacht', vor, tag) + spalteTag(mitte, tag) + spalteNacht('Nacht', nach, tag) + '</div>' +
      '<div class="wx-szs">' + alle.map(stundenZeile).join('') + '</div>' +
    '</div>';
    var b = WP.blattAuf('tag', html, { titel: d.ort.name, untertitel: tag.lang, rechts: WP.icons.auf, rechtsTitel: 'Übersicht ein-/ausklappen' });

    var spalten = b.querySelector('.wx-spalten'), pfeil = b.querySelector('[data-blatt-rechts]');
    pfeil.addEventListener('click', function () {
      spalten.hidden = !spalten.hidden;
      pfeil.innerHTML = spalten.hidden ? WP.icons.ab : WP.icons.auf;
    });
    // Heute: so scrollen, dass die laufende Stunde oben steht
    if (tag.istHeute && b) {
      var inh = b.querySelector('.inhalt'), z = b.querySelector('.wx-sz[data-stunde="' + WP.jetzt(d).hh + '"]');
      if (inh && z) inh.scrollTop = z.getBoundingClientRect().top - inh.getBoundingClientRect().top + inh.scrollTop;
    }
  }

  // ---------- Modul ----------
  WP.module.wetter = {
    zeichnen: function (pane, daten) {
      pane.innerHTML = aktuellHtml(daten) + stundenHtml(daten) + tageHtml(daten);
      pane.querySelectorAll('.wx-tag').forEach(function (z) {
        var oeffnen = function () { tagesdetail(daten, +z.dataset.tag); };
        z.addEventListener('click', oeffnen);
        z.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); oeffnen(); } });
      });
    }
  };
})(window);

/* WetterPro.Ma – Reiter „Graphs": Tagesspalten mit Temperatur, Niederschlag, Sonne, Wind, Luftdruck. */
(function (global) {

  var CW = 105;            // Breite je Tag (px)

  function Band(h, min, max) {

    this.oben = 6; this.unten = 20;   // Rand oben / Platz für Stundenmarken unten

  Band.prototype.y = function (v) { return this.oben + (this.max - v) / (this.max - this.min) * (this.h - this.oben - this.unten); };

  function xs(i) { return i * (CW / 24) + CW / 48; }

      var v = stunden[i][feld];

      out += (offen ? 'L' : 'M') + f1(xs(i)) + ' ' + f1(y(v));
      offen = true;
    }

  // Gitter, Tagesgrenzen, Stundenmarken und Jetzt-Linie für ein Band

    }
    for (var d = 0; d < n; d++) {
      g += '<line x1="' + (d * CW) + '" x2="' + (d * CW) + '" y1="0" y2="' + band.h + '" stroke="' + GRENZE + '" stroke-width=".6"/>';
      var hr = [0, 6, 12, 18];
      for (i = 0; i < hr.length; i++) {
        g += '<text x="' + f1(d * CW + hr[i] * CW / 24 + 5) + '" y="' + (band.h - 5) + '" font-size="11" fill="#fff" ' + FONT + '>' + WP.hh(hr[i]) + '</text>';
      }
    }
    if (jetztIdx != null) {
      var jx = f1(xs(jetztIdx));
      g += '<line x1="' + jx + '" x2="' + jx + '" y1="0" y2="' + band.h + '" stroke="' + JETZT + '" stroke-width="1"/>';
    }
    return g;
  }

  function achse(band, ticks) {
    var t = '';
    for (var i = 0; i < ticks.length; i++) {
      t += '<text x="' + (AX - 5) + '" y="' + f1(band.y(ticks[i]) + 4) + '" text-anchor="end" font-size="11" fill="#fff" ' + FONT + '>' + ticks[i] + '</text>';
    }
    return '<div class="g-yax"><svg viewBox="0 0 ' + AX + ' ' + band.h + '" width="' + AX + '" height="' + band.h + '" aria-hidden="true">' + t + '</svg></div>';
  }

  function svgAuf(W, h) { return '<svg viewBox="0 0 ' + W + ' ' + h + '" width="' + W + '" height="' + h + '" aria-hidden="true">'; }

  function ticksZwischen(min, max, schritt) {
    var t = [];
    for (var v = Math.ceil(min / schritt) * schritt; v <= max + 1e-9; v += schritt) t.push(Math.round(v * 100) / 100);
    return t;
  }

    var out = [];
    for (var i = 0; i < stunden.length; i++) { var v = stunden[i][feld]; if (v != null && !isNaN(v)) out.push(v); }
    return out;
  }

  function balken(stunden, feld, band, farbe, skala, luft) {
    var out = '', bw = CW / 24 - (luft || 1);
    for (var i = 0; i < stunden.length; i++) {
      var v = stunden[i][feld];
      if (v == null || isNaN(v) || v <= 0) continue;
      var vv = Math.min(v * (skala || 1), band.max);
      out += '<rect x="' + f1(i * CW / 24 + 0.5) + '" y="' + f1(band.y(vv)) + '" width="' + f1(bw) + '" height="' + f1(band.y(0) - band.y(vv)) + '" fill="' + farbe + '"/>';

  function zeichnen(pane, daten) {

    kopf += '</div>';

    var symbole = '<div class="band">Wetter</div><div class="g-row"><div class="g-yax g-info">' + WP.icons.tab_wetter + '</div>';
    for (i = 0; i < n; i++) {
      symbole += '<div class="g-icon">' + WP.symbol(WP.wetter.art(tage[i].code, true)) + '<span>' + esc(WP.wetter.text(tage[i].code, true)) + '</span></div>';
    }

    // ---------- Temperatur ----------
    var tw = werte(stunden, 'temp').concat(werte(stunden, 'gef'));
    var tmin = tw.length ? Math.min.apply(null, tw) : 0, tmax = tw.length ? Math.max.apply(null, tw) : 10;
    var lo = Math.floor((tmin - 1) / 2) * 2, hi = Math.ceil((tmax + 1) / 2) * 2;
    if (hi - lo < 10) { var mitte = (lo + hi) / 2; lo = Math.floor((mitte - 5) / 2) * 2; hi = lo + 10; }

    var tT = ticksZwischen(lo, hi, 2);
    var maxPts = '', minPts = '';
    for (i = 0; i < n; i++) {

      if (tage[i].tmin != null) minPts += (minPts ? 'L' : 'M') + cx + ' ' + f1(bT.y(tage[i].tmin));

    var temp = svgAuf(W, bT.h) + rahmen(bT, tT, n, W, jetztIdx) +
      '<path d="' + pfad(stunden, 'gef', function (v) { return bT.y(v); }) + '" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2" stroke-linejoin="round"/>' +

    }

    // ---------- Niederschlag ----------
    var rw = werte(stunden, 'regen');

    rTop = Math.ceil(rTop / rSchritt) * rSchritt;
    var bR = new Band(110, 0, rTop);
    var tR = ticksZwischen(rSchritt, rTop, rSchritt);

      balken(stunden, 'regen', bR, '#5fdcf0') +
      '<path d="' + pfad(stunden, 'pct', function (v) { return bR.y(v / 100 * rTop); }) + '" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1"/></svg>';

        var html = '<div class="wk-marke' + (k.hier ? ' is-hier' : '') + '"><i></i><span class="wk-name">' + k.name.replace(/[<>&]/g, '') + '</span>' + wetterHtml(k, t) + '</div>';
        var m = marken[k.id];
        if (!m) {
          m = L.marker([k.lat, k.lon], { icon: L.divIcon({ className: 'wk-mk', html: html, iconSize: null, iconAnchor: [0, 0] }), interactive: false, keyboard: false, zIndexOffset: k.hier ? 1000 : 500 - Math.round(k.rang * 100) });
          m.addTo(markenEbene); marken[k.id] = m;
        } else {
          var e2 = m.getElement(); if (e2) e2.innerHTML = html;
          m.setLatLng([k.lat, k.lon]);
        }
      });
      for (var id in marken) if (!genutzt[id]) { markenEbene.removeLayer(marken[id]); delete marken[id]; }
    }
    function wetterHtml(k, t) {
      if (!gitter || !frames.length) return '';
      var temp = wertBi(gitter, 'temp', k.lat, k.lon, t), code = wertNah(gitter, 'code', k.lat, k.lon, t), tag = wertNah(gitter, 'tag', k.lat, k.lon, t);
      if (isNaN(temp) || isNaN(code)) return '';

    }

    // ---------- Anzeigen ----------
    function anzeigen(ebeneGewechselt) {
      if (!frames.length) return;
      var zeit = frames[idx];
      el.titel.innerHTML = '<b>' + zeitText(zeit, true) + '</b>' + (MODUS === 'karten' ? 'Vorhersage' : (snap ? 'gespeichert' : 'Beobachtung'));
      beiZeit(zeitText(zeit, true));
      if (MODUS === 'karten') { flaecheZeichnen(); markenSetzen(); }
      else { if (ebeneGewechselt) { for (var i in frameLayer) { var f = frameLayer[i]; ['sat', 'satsw', 'regen', 'radar'].forEach(function (k) { if (f[k]) f[k].setOpacity(0); }); } } bildebenenZeigen(); if (ebeneGewechselt) markenSetzen(); }

    // Ohne Netz: das gespeicherte Bild soll die ganze Fläche ausfüllen (wie „cover"), zoomen darf man näher heran,
    // aber nicht weiter weg als bis zum Bildrand. Wird die Fläche anders (Querformat), rechnen wir neu.
    var offlineBounds = null;
    function offlineAnsicht(erstmals) {
      if (!offlineBounds) return;
      map.invalidateSize({ animate: false });
      var deckend = map.getBoundsZoom(offlineBounds, true);   // true = Ausschnitt füllt die Fläche vollständig
      var schaerfsteStufe = (snap && snap.detail && snap.detailZ) ? snap.detailZ + 1 : (snap && snap.z ? snap.z : 7) + 1.3;
      map.setMinZoom(deckend); map.setMaxZoom(Math.max(deckend + 1, schaerfsteStufe));
      if (erstmals) {
        var mitte = offlineBounds.contains([ort.lat, ort.lon]) ? L.latLng(ort.lat, ort.lon) : offlineBounds.getCenter();
        map.setView(mitte, Math.min(map.getMaxZoom(), Math.max(deckend, START_ZOOM)), { animate: false });
      } else if (map.getZoom() < deckend) {
        map.setZoom(deckend, { animate: false });
      }
    }
    function zoomKnoepfe() {
      var z = map.getZoom();
      wurzel.querySelectorAll('[data-zoom]').forEach(function (b) {
        b.disabled = +b.dataset.zoom > 0 ? z >= map.getMaxZoom() - 0.01 : z <= map.getMinZoom() + 0.01;
      });
    }
    function groesseGeaendert() {
      if (!map) return;
      map.invalidateSize({ animate: false });
      if (OFFLINE) offlineAnsicht(false);

    }
    window.addEventListener('resize', groesseGeaendert);
    window.addEventListener('orientationchange', function () { setTimeout(groesseGeaendert, 300); });

    // ---------- Start ----------
    function start() {
      knoepfe();
      if (OFFLINE) {
        lade(true);
        fetch(SNAP + 'karte.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('kein Snapshot'); return r.json(); }).then(function (j) {
          snap = j;
          var bounds = L.latLngBounds([j.bounds.sued, j.bounds.west], [j.bounds.nord, j.bounds.ost]);
          if (j.basis) L.imageOverlay(SNAP + j.basis.replace(/^snapshot\//, ''), bounds, { interactive: false, zIndex: 1, className: 'wk-basis-bild' }).addTo(map);
          // Nahaufnahme (Zoom 9) über der groben Grundkarte, damit die Standardansicht scharf ist
          if (j.detail && j.detailBounds) {
            var db = j.detailBounds;
            L.imageOverlay(SNAP + j.detail.replace(/^snapshot\//, ''), L.latLngBounds([db.sued, db.west], [db.nord, db.ost]), { interactive: false, zIndex: 2, className: 'wk-basis-bild' }).addTo(map);
          }
          map.options.zoomSnap = 0;                       // Bild soll die Fläche füllen, nicht auf halbe Zoomstufen springen
          offlineBounds = bounds;
          offlineAnsicht(true);
          map.options.maxBoundsViscosity = 1;             // am Bildrand ist Schluss, kein Gummiband ins Leere
          map.setMaxBounds(bounds);
          hinweis('Gespeicherter Stand vom ' + new Date(j.stand).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' Uhr (kein Netz). Zoomen und Verschieben gehen innerhalb des gespeicherten Ausschnitts.');
          setTimeout(function () { hinweis(''); }, 6000);
          return fetch(SNAP + (j.gitter || 'karte-gitter.json').replace(/^snapshot\//, ''), { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
        }).then(function (gj) {
          if (gj && gj.antwort) gitter = gitterAus(gj.antwort, gj.lats, gj.lons);
          lade(false); framesBauen(); anzeigen(true);
        }).catch(function (e) { console.warn(e); lade(false); hinweis('Ohne Internet gibt es keine Karte – die gespeicherte Ansicht fehlt.'); });
        return;
      }
      if (MODUS === 'karten') {
        gitterHolen().then(function () { if (abgebaut) return; framesBauen(); anzeigen(true); });
      } else {
        framesBauen();
        Promise.all([rainviewerHolen(), gitterHolen()]).then(function () { if (abgebaut) return; anzeigen(true); });
      }
    }
    start();
    var uhr = setInterval(function () {           // Rad/Sat: alle 10 Minuten kann ein neues Bild da sein
      if (abgebaut || OFFLINE || MODUS !== 'radsat' || film) return;
      var alt = frames[frames.length - 1]; framesBauen();
      if (frames[frames.length - 1] !== alt) { frameLayer = {}; map.eachLayer(function (l) { if (l instanceof L.TileLayer && l !== basis) map.removeLayer(l); }); anzeigen(true); }
    }, 5 * 60000);

    return {
      zeigeOrt: function (neu, neueOrte) {
        if (neueOrte) orte = neueOrte;
        var wechsel = !ort || ort.id !== neu.id; ort = neu;
        if (wechsel && !OFFLINE) { filmStopp(); map.setView([ort.lat, ort.lon], START_ZOOM, { animate: false }); }
        else markenSetzen();
      },
      setzeOffset: function (s) { offset = s || 0; ticks(); if (frames.length) anzeigen(false); },
      sichtbar: function () { map.invalidateSize(); ticks(); markenSetzen(); },
      verlassen: function () { filmStopp(); },
      abbauen: function () { window.removeEventListener('resize', groesseGeaendert); abgebaut = true; filmStopp(); clearInterval(uhr); map.remove(); wurzel.innerHTML = ''; wurzel.classList.remove('wk'); }
    };
  }

  global.WetterKarte = { einbauen: einbauen, staedte: STAEDTE, icons: ICONS };

/* WetterPro Klassik – Reiter „Karten" (Wetterkarte mit Temperatur, Niederschlag, Wind, Wolken, Luftdruck)
   und „Rad/Sat" (Regen-Radar, Satellit). Beide nutzen den gemeinsamen Baustein ../gemeinsam/wpkarte.js.
   Eingebaut wird erst, wenn der Reiter sichtbar ist – eine verborgene Karte misst 0 Pixel. */
(function (global) {
  'use strict';
  var WP = global.WP = global.WP || {};
  WP.module = WP.module || {};

  function modul(modus) {
    var karte = null, pane = null, daten = null;
    function zeit(text) {
      var u = document.getElementById('k-unter');
      if (!u) return;
      u.textContent = text; u.hidden = WP.zustand.reiter !== modus;
    }
    function bauen() {
      if (!pane || !daten || pane.hidden) return;
      if (karte) { karte.setzeOffset(daten.offset); karte.zeigeOrt(daten.ort, WP.zustand.orte); return; }
      if (!global.WetterKarte) { pane.innerHTML = '<div class="laden">Der Kartenbaustein fehlt.</div>'; return; }
      pane.innerHTML = '';
      karte = WetterKarte.einbauen({
        ziel: pane, modus: modus, ort: daten.ort, orte: WP.zustand.orte, offset: daten.offset,
        symbol: function (code, istTag) { return WP.symbol(WP.wetter.art(code, istTag)); },
        offline: WP.OFFLINE, snapshot: WP.SNAP, merk: WP.merk, beiZeit: zeit
      });
    }
    return {
      zeichnen: function (p, d) { pane = p; daten = d; bauen(); },
      sichtbar: function (p) { pane = p; bauen(); if (karte) karte.sichtbar(); },
      verlassen: function () { if (karte) karte.verlassen(); }
    };
  }
  WP.module.karten = modul('karten');
  WP.module.radsat = modul('radsat');
})(window);

WP.start();
