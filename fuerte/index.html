<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2124">
<title>WetterPro Fuerte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ---- css/app.css ---- */
/* Schrift der Fuerte-Seite; als @import, damit bauen.py sie mit in die Einzeldatei nimmt (steht deshalb ganz vorn) */
@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");

/* WetterPro Fuerte – Grundgestaltung im Stil der Fuerteventura-Seite:
   dunkel, ruhig, Sand/Nachtmeer, Türkis und Ocker als Akzente, sanfte Ecken (12 px).
   Hell/Dunkel über data-theme am <html>, Akzentfarbe über data-akzent. */

/* ---- Farben: dunkel ist die Vorgabe ---- */
:root {
  --page:#14181a; --surface:#1b2124; --surface-2:#202729; --border:#303836;
  --ink:#ede9e0; --ink-dim:#b4ac9c;
  --teal:#4bc4cb; --teal-ink:#0a2224; --ochre:#e0a24f; --gold:#d4a53a; --salbei:#8fc9a0;
  --wert:#f1d27a;   /* Zahlen und Werte (Temperatur, Sonnenstunden): warmes Gold, passt zu Sonne und Ringen */
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  --akzent:var(--teal); --akzent-ink:var(--teal-ink);
  color-scheme:dark;
}
:root[data-theme="light"] {
  --page:#e9ebe6; --surface:#f8f8f4; --surface-2:#eef0ea; --border:#d7d6c9;
  --ink:#1c1a17; --ink-dim:#5b564c;
  --teal:#0f6e76; --teal-ink:#ffffff; --ochre:#b5741f; --gold:#b8861f; --salbei:#3f8f5c;
  --wert:#a86f14;
  --shadow:0 1px 2px rgba(28,26,23,.06), 0 8px 24px -12px rgba(28,26,23,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --page:#e9ebe6; --surface:#f8f8f4; --surface-2:#eef0ea; --border:#d7d6c9;
    --ink:#1c1a17; --ink-dim:#5b564c;
    --teal:#0f6e76; --teal-ink:#ffffff; --ochre:#b5741f; --gold:#b8861f; --salbei:#3f8f5c;
    --wert:#a86f14;
    --shadow:0 1px 2px rgba(28,26,23,.06), 0 8px 24px -12px rgba(28,26,23,.18);
    color-scheme:light;
  }
}
:root[data-akzent="ocker"]  { --akzent:var(--ochre);  --akzent-ink:#2a1c08; }
:root[data-akzent="gold"]   { --akzent:var(--gold);   --akzent-ink:#2a1f06; }
:root[data-akzent="salbei"] { --akzent:var(--salbei); --akzent-ink:#0c2416; }

/* Brücke zu den Modul-Stilen (wetter.css, karten.css nutzen diese Namen) */
:root, :root[data-theme="light"], :root[data-theme="auto"] {
  --blau:var(--surface); --kopf:var(--surface); --hell:var(--surface-2); --leiste:var(--surface-2);
  --gelb:var(--wert); --cyan:var(--teal); --dim:var(--ink-dim);
  --linie:var(--border); --linie-dunkel:rgba(0,0,0,.22);
  --text:var(--ink);
  --schrift:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --zahlen:Arial, Helvetica, sans-serif;
}

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--page); color:var(--ink); font:15px/1.5 var(--schrift);
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }
button { font-family:inherit; -webkit-tap-highlight-color:transparent; color:inherit; }
button:focus-visible, input:focus-visible { outline:2px solid var(--akzent); outline-offset:1px; }
svg { display:block; }
.ic { width:24px; height:24px; }
.ic.klein { width:12px; height:12px; }
.scroll { overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.scroll::-webkit-scrollbar { display:none; }
.hair { border-bottom:1px solid var(--border); }
.zahl, .wx-temp, .wx-tt, .wx-u b, .wx-sp-temp, .wx-sz-temp, .wx-w div b, .ort-eintrag .t { font-family:var(--zahlen); font-variant-numeric:tabular-nums; }

.app { max-width:430px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--page); position:relative; }
.screen { flex:1; }
.pane { min-height:60vh; }

/* Kopfzeile */
.top { position:sticky; top:0; z-index:15; background:var(--surface); border-bottom:1px solid var(--border);
  display:grid; grid-template-columns:48px minmax(0,1fr) 48px; align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) 4px 8px; min-height:52px; }
.top .titel { text-align:center; font-size:18px; font-weight:700; letter-spacing:-0.015em; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.top .unter { text-align:center; font-size:11.5px; color:var(--ink-dim); line-height:1.2; text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
.top button { border:0; background:none; width:48px; height:40px; display:grid; place-items:center; cursor:pointer; color:var(--ink-dim); }
.top .zurueck { width:auto; padding:0 6px 0 4px; display:flex; align-items:center; gap:2px; font-size:15px; font-weight:600; justify-self:start; color:var(--akzent); }

/* Reiterleiste */
.tabbar { position:sticky; bottom:0; z-index:15; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom,0px); border-top:1px solid var(--border); }
.tab { border:0; background:none; display:grid; justify-items:center; gap:3px; padding:9px 0 6px; cursor:pointer; color:var(--ink-dim); font:600 11.5px var(--schrift); letter-spacing:.02em; }
.tab .ic { stroke-width:1.5; }
.tab.is-on { color:var(--akzent); }

/* Blätter über der App (Orte, Tagesdetail, Mond, Modell) */
.blatt { position:fixed; top:0; left:0; right:0; bottom:calc(58px + env(safe-area-inset-bottom,0px)); max-width:430px; margin:0 auto; z-index:25; background:var(--page); display:flex; flex-direction:column; }
.blatt .inhalt { flex:1; overflow:auto; position:relative; -webkit-overflow-scrolling:touch; }

/* Abschnittstitel: kleine Kapitälchen in der Akzentfarbe, wie .eyebrow auf der Fuerte-Seite */
.band { padding:16px 14px 6px; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--akzent); background:none; }

/* Kasten: ruhige Fläche mit sanften Ecken */
.kasten { margin:0 12px 12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }

/* Listen */
.zeile-liste { margin:0 12px 12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.eintrag { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); font-size:15px; min-height:48px; cursor:pointer; }
.zeile-liste > :last-child { border-bottom:0; }
.eintrag span { color:var(--ink-dim); font-size:13px; text-align:right; }
.eintrag .ic { color:var(--ink-dim); flex:none; }
.eintrag button { border:0; background:none; padding:0; cursor:pointer; }
.eintrag.is-on { box-shadow:inset 3px 0 0 var(--akzent); }
.eintrag.is-on span { color:var(--akzent); }
.hinweis { padding:6px 16px 16px; font-size:12.5px; color:var(--ink-dim); line-height:1.5; }
.hinweis a { color:var(--teal); }

/* Wahlzeilen (Erscheinungsbild, Akzent, Modell) */
.wahl { display:flex; gap:8px; padding:10px 14px 14px; flex-wrap:wrap; }
.wahl button { flex:1; min-width:84px; min-height:40px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--ink-dim); font:600 13.5px var(--schrift); cursor:pointer; }
.wahl button.is-on { border-color:var(--akzent); color:var(--ink); background:var(--surface); }
.wahl .farbe { display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px; margin-right:6px; border:1px solid rgba(0,0,0,.2); }

/* Orte-Blatt */
.suche { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); color:var(--ink-dim); }
.suche input { flex:1; min-width:0; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font:16px var(--schrift); padding:8px 10px; border-radius:10px; }
.suche input::placeholder { color:var(--ink-dim); }
.ort-eintrag { display:grid; grid-template-columns:52px 44px minmax(0,1fr) 44px; gap:8px; align-items:center; padding:9px 10px 9px 12px; border-bottom:1px solid var(--border); cursor:pointer; }
.zeile-liste > .ort-eintrag:last-child { border-bottom:0; }
.ort-eintrag .t { color:var(--wert); font-size:15px; line-height:1.15; font-weight:700; }
.ort-eintrag .t span { display:block; color:var(--ink-dim); font-size:11.5px; font-weight:400; font-family:var(--schrift); }
.ort-eintrag .sym { width:44px; height:44px; }
.ort-eintrag .n { font-size:16px; font-weight:600; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ort-eintrag .n span { display:block; color:var(--ink-dim); font-size:12.5px; font-weight:400; }
.ort-eintrag .ic { color:var(--ink-dim); }
.ort-eintrag.is-on .ic { color:var(--akzent); }

/* Ziehen zum Aktualisieren (wie im Original) */
.ziehen { height:0; overflow:hidden; display:flex; align-items:center; gap:18px; padding:0 22px; transition:height .18s ease-out; }
.ziehen-pfeil { width:24px; height:32px; flex:none; opacity:.55; transition:opacity .15s; }
.ziehen.is-bereit .ziehen-pfeil { opacity:1; }
.ziehen-text { font-size:17px; font-weight:600; line-height:1.3; }
.ziehen-datum { font-size:15px; line-height:1.3; opacity:.9; }

/* Lade- und Fehlerzustand */
.laden { padding:40px 20px; text-align:center; color:var(--ink-dim); font-size:14px; }
.fehler { margin:20px 14px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; background:var(--surface); font-size:14px; line-height:1.45; }
.fehler button { margin-top:8px; border:1px solid var(--akzent); color:var(--akzent); background:none; padding:6px 12px; border-radius:10px; cursor:pointer; font-weight:600; }
.snapshot-hinweis { background:var(--surface-2); color:var(--ink-dim); font-size:12px; padding:5px 12px; text-align:center; border-bottom:1px solid var(--border); }

/* Mond-Blatt */
.mo-kopf { display:grid; grid-template-columns:120px minmax(0,1fr); gap:14px; align-items:center; padding:18px 16px 12px; }
.mo-kopf .sym { width:120px; height:120px; }
.mo-name { font-size:20px; font-weight:700; letter-spacing:-0.015em; line-height:1.2; }
.mo-zus { color:var(--ink-dim); font-size:13.5px; margin-top:4px; line-height:1.5; }
.mo-zus b { color:var(--ink); font-weight:600; font-family:var(--zahlen); }
.mo-zeiten { display:grid; grid-template-columns:1fr 1fr; }
.mo-zeiten > div { padding:12px 14px; }
.mo-zeiten > div + div { border-left:1px solid var(--border); }
.mo-zeiten small { display:block; color:var(--ink-dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:2px; }
.mo-zeiten b { font-size:22px; font-weight:700; font-family:var(--zahlen); }
.mo-phasen .eintrag { cursor:default; }
.mo-phasen .sym { width:34px; height:34px; flex:none; }
.mo-phasen .l { flex:1; display:flex; align-items:center; gap:10px; }
.mo-tage { display:flex; padding:8px 4px 12px; }
.mo-tage > div { flex:1; text-align:center; font-size:11.5px; color:var(--ink-dim); line-height:1.2; }
.mo-tage .sym { width:30px; height:30px; margin:0 auto 2px; }
.mo-tage b { display:block; color:var(--ink); font-weight:600; font-family:var(--zahlen); }

@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* Querformat auf dem Handy: ganze Breite nutzen, damit Karten und Listen nicht in einer schmalen Säule stehen */
@media (orientation: landscape) and (max-height: 520px) {
  .app, .blatt { max-width: none; }
}

/* ---- ../gemeinsam/meteogramm.css ---- */
/* ===========================================================================
   Meteogramm - gestapelte Wetterdiagramme mit gemeinsamer Zeitachse.
   Eigenständiger Baustein: hängt an keiner bestimmten Seite.

   Farben kommen aus CSS-Variablen der umgebenden Seite, jede mit einem
   Ersatzwert - so sieht es auch ohne eigenes Farbschema ordentlich aus.
   Wer eigene Farben will, setzt --mg-* am Container oder an :root.
   =========================================================================== */
.mg {
  --mg-flaeche:  var(--surface,   #1b2124);
  --mg-flaeche2: var(--surface-2, #202729);
  --mg-rand:     var(--border,    #303836);
  --mg-text:     var(--ink,       #ede9e0);
  --mg-text-still: var(--ink-dim, #b4ac9c);
  --mg-akzent:   var(--teal,      #4bc4cb);
  --mg-schatten: var(--shadow, 0 1px 3px rgba(0,0,0,.25));
  --mg-serif: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  /* Schrift für die Zahlen: Arial (gewählt 25.09.2026, Nr. 18 der Schriftprobe) */
  --mg-mono: Arial, Helvetica, sans-serif;
  /* Wie weit die Datumsfahne beim Scrollen vom oberen Rand bleibt
     (z. B. Höhe einer festen Menüleiste der Seite) */
  --mg-haft-oben: 0px;
  /* Wie weit die Knopfleiste beim Scrollen vom unteren Rand bleibt
     (z. B. Höhe einer festen Fußleiste der Seite) */
  --mg-haft-unten: 0px;
  /* Eckenrundung der Knöpfe: "sanft" (Stephans Wahl 05.10.2026) */
  --mg-r: 11px;

  background: var(--mg-flaeche);
  border: 1px solid var(--mg-rand);
  border-radius: 18px;
  margin: 0 auto 14px;
  box-shadow: var(--mg-schatten);
  /* Nicht beschneiden: sonst kann die Datumsfahne beim Scrollen nicht haften */
  overflow: visible;
  color: var(--mg-text);
  font-family: var(--mg-serif);
}

/* ---- Kopfbereich: Orte, Modelle, Zeilenauswahl ---- */
/* Eine Zeile (Stephans Wahl 05.10.2026): Orte als flache Reiter mit Unterstrich,
   rechts daneben das Wettermodell als kleines Feld "Mix ▾" mit Aufklapp-Liste. */
.mg-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px 0; }
.mg-tabs { display: inline-flex; gap: 0; min-width: 0; }
.mg-tab { min-height: 32px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--mg-text-still); font: 600 13.5px/1 var(--mg-serif); cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.mg-tab.is-on { color: var(--mg-text); border-bottom-color: var(--mg-akzent); }
.mg-modell { position: relative; flex: none; }
.mg-modell-btn { display: inline-flex; align-items: center; gap: 3px; min-height: 30px; padding: 0 7px 0 9px; border: 1px solid var(--mg-rand); border-radius: 9px; background: var(--mg-flaeche2); color: var(--mg-text-still); font: 600 11.5px/1 var(--mg-mono); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mg-modell-btn .mg-i { width: 14px; height: 14px; }
.mg-modell-panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; display: grid; gap: 2px; min-width: 250px; max-width: calc(100vw - 32px); padding: 6px; background: var(--mg-flaeche); border: 1px solid var(--mg-rand); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.mg-modell-panel[hidden] { display: none; }
.mg-modell-opt { display: grid; gap: 1px; text-align: left; padding: 7px 9px; border: 0; border-radius: 8px; background: transparent; color: var(--mg-text); font: 500 12.5px/1.3 var(--mg-serif); cursor: pointer; }
.mg-modell-opt b { font-family: var(--mg-mono); font-size: 12.5px; }
.mg-modell-opt span { color: var(--mg-text-still); font-size: 11.5px; }
.mg-modell-opt:hover { background: var(--mg-flaeche2); }
.mg-modell-opt.is-on { background: var(--mg-flaeche2); box-shadow: inset 2px 0 0 var(--mg-akzent); }

/* ---- Datumsfahne am oberen Ende des Auswahl-Strichs ----
   Bleibt beim Scrollen der Seite oben stehen, damit man immer sieht,
   zu welcher Stunde die Werte gehören. */
/* z-index 8: liegt ueber der Knopfleiste (7) - scrollt die Leiste an ihr vorbei, taucht sie unter der Fahne durch */
.mg-readout { position: sticky; top: var(--mg-haft-oben); z-index: 8; display: flex; flex-direction: column; align-items: center; min-width: 0;
  padding: 6px 14px 4px; background: var(--mg-flaeche); border-radius: 0 0 12px 12px; box-shadow: 0 10px 14px -10px rgba(0,0,0,.55); }
/* Eine Zeile (Stephans Wahl 05.10.2026): Datum, Uhrzeit, Abstand und Wetterlage zusammen im Kasten */
.mg-zeit { display: inline-flex; align-items: baseline; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 5px 12px; border-radius: 8px;
  background: var(--mg-text); color: var(--mg-flaeche); font-family: var(--mg-mono); font-size: 1rem; font-weight: 700; }
.mg-rel { font-family: var(--mg-serif); font-size: 12.5px; font-weight: 600; color: var(--mg-flaeche); opacity: .72; }
.mg-lage { display: inline-flex; align-items: baseline; gap: 5px; margin-left: 2px; padding-left: 10px; border-left: 1px solid var(--mg-flaeche); font: 600 13px/1.2 var(--mg-serif); color: var(--mg-flaeche); opacity: .9; }
.mg-lage:empty { display: none; }
.mg-lage-i { font-size: 1rem; line-height: 1; margin-right: 4px; }

/* Die Werte "am Strich": der Auswahl-Strich läuft senkrecht durch die Liste,
   links davon die Bezeichnung, rechts Zahl und Zusatz darunter. Keine Kästen,
   keine Farben, nur eine feine Linie zwischen den Zeilen. */
/* Seit 06.10.2026: eine schmale Zeile in der haftenden Fahne. Hier stehen nur die Werte, die im
   Diagramm keine Zahl an der Achse haben (Sonne, Regen, gefühlt, Böen). Alles andere liest man
   an der Wertlinie ab. */
.mg-werte { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 2px 12px; padding: 5px 0 1px; min-width: 0; }
.mg-werte[hidden] { display: none; }
.mg-wert { display: inline-flex; align-items: baseline; gap: 4px; min-width: 0; }
.mg-wl { font-size: 11.5px; color: var(--mg-text-still); white-space: nowrap; }
.mg-wr { display: inline-flex; align-items: baseline; gap: 0 5px; min-width: 0; }
.mg-wv { font-family: var(--mg-mono); font-size: 13px; font-weight: 700; color: var(--mg-text); white-space: nowrap; }
.mg-wv small { font-size: 0.78em; font-weight: 600; color: var(--mg-text-still); margin-left: 2px; }
.mg-wz { font-size: 11px; color: var(--mg-text-still); white-space: nowrap; }
.mg-sep { color: var(--mg-text-still); font-size: 12px; }

/* ---- Knopfleiste unter dem Diagramm (Stephans Wahl vom 05.10.2026) ----
   ↻ links außen, ‹ Jetzt › als Gruppe in einem Rahmen in der Mitte, ☰ rechts außen.
   Die Leiste haftet unten am Bildschirm, bis das Tool aus dem Bild ist; auf dem
   Handy bleibt sie so immer unterm Daumen. */
.mg-knoepfe { position: sticky; bottom: var(--mg-haft-unten); z-index: 7; display: grid; grid-template-columns: minmax(max-content, 1fr) auto minmax(max-content, 1fr); align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--mg-flaeche); border-top: 1px solid var(--mg-rand); border-bottom: 1px solid var(--mg-rand); }
.mg-mitte { display: flex; justify-content: center; min-width: 0; }
.mg-rechts { display: inline-flex; justify-content: flex-end; gap: 8px; }
/* ---- Vollbild (07.10.2026): Knopf ⤢ in der Leiste, × oben rechts, Leiste ganz unten am Bildschirmrand ---- */
.mg-vollbild-x { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 10px; z-index: 80; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--mg-rand); color: var(--mg-text); cursor: pointer; -webkit-tap-highlight-color: transparent;
  background: rgba(27,33,36,0.85); background: color-mix(in srgb, var(--mg-flaeche) 85%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.mg-vollbild-x[hidden] { display: none; }
.mg-vollbild-x .mg-i { width: 20px; height: 20px; }
/* Im Vollbild sitzt das × oben rechts neben der Fahne: Kasten etwas kompakter, nie umbrechen, lange Wetterlage mit … kürzen */
.mg-vollbild .mg-readout { padding-right: 46px; }
.mg-vollbild .mg-zeit { flex-wrap: nowrap; max-width: 100%; font-size: 0.92rem; padding: 4px 10px; gap: 6px; }
.mg-vollbild .mg-zeit > span:first-child { white-space: nowrap; }
.mg-vollbild .mg-lage { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; font-size: 12px; }
/* Im Vollbild haftet die Leiste knapp ueber dem Home-Balken des iPhones (Safe-Area unten), nie darauf.
   Solange sie wirklich haftet (Klasse is-haftend, siehe meteogramm.js), zieht ::after die Leistenfarbe
   bis zum Bildschirmrand - so sieht es aus wie eine Leiste bis ganz unten, die Knoepfe bleiben aber frei. */
.mg-vollbild { --mg-haft-unten: env(safe-area-inset-bottom, 0px) !important; }
.mg-vollbild .mg-knoepfe { border-bottom: 0; }
/* Ist das ☰-Menue offen (klappt nach oben auf), darf die Fahne es nicht verdecken */
.mg:has(.mg-zeilen-panel:not([hidden])) .mg-readout { z-index: 5; }
.mg-vollbild .mg-knoepfe.is-haftend::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: env(safe-area-inset-bottom, 0px); background: var(--mg-flaeche); }
.mg-haft-fuss { height: 1px; margin-top: -1px; visibility: hidden; pointer-events: none; }
.mg-ecke-lupe { cursor: pointer; border: 0; background: transparent; -webkit-tap-highlight-color: transparent; }
/* Ein Rahmen pro Gruppe: die Knöpfe darin ohne eigenen Rand, Trennstriche dazwischen */
.mg-gruppe { display: inline-flex; align-items: stretch; border: 1px solid var(--mg-rand); border-radius: var(--mg-r); overflow: hidden; background: var(--mg-flaeche2); }
.mg-gruppe .mg-btn { border: 0; border-radius: 0; background: transparent; }
.mg-gruppe > * + * { border-left: 1px solid var(--mg-rand); }
/* Jetzt: nur fetter als die anderen, dazu der Abstand zur Stelle ("+14 h") */
.mg-btn-jetzt { min-width: 118px; padding: 0 14px; gap: 7px; font-weight: 700; }
.mg-jrel { font-family: var(--mg-mono); font-size: 12.5px; font-weight: 600; color: var(--mg-text-still); }
.mg-jrel:empty { display: none; }
/* Jetzt ruht, wenn der Strich schon auf jetzt steht: blass, aber die Trennstriche bleiben */
.mg-gruppe .mg-btn:disabled { opacity: 1; }
.mg-gruppe .mg-btn:disabled > * { opacity: 0.4; }
.mg-btn:disabled { opacity: 0.35; cursor: default; }
@media (max-width: 480px) { .mg-knoepfe { gap: 6px; padding-left: 8px; padding-right: 8px; } .mg-rechts { gap: 6px; } .mg-btn-jetzt { min-width: 96px; padding: 0 8px; } }
.mg-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 40px; padding: 0 12px; border-radius: var(--mg-r); border: 1px solid var(--mg-rand); background: var(--mg-flaeche2); color: var(--mg-text); font: 600 13.5px/1 var(--mg-serif); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mg-btn:active { transform: scale(0.97); }
/* Einfarbige Symbole in der Schriftfarbe des Knopfs */
.mg-i { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mg-btn-frisch.is-laedt { color: var(--mg-akzent); }
@keyframes mg-dreht { to { transform: rotate(360deg); } }
.mg-btn-frisch.is-laedt .mg-i { animation: mg-dreht 0.9s linear infinite; }
@media (prefers-reduced-motion: reduce) { .mg-btn-frisch.is-laedt .mg-i { animation: none; opacity: 0.5; } }

/* ---- Zeilenauswahl ---- */
.mg-zeilenwahl { position: relative; }
/* Seit 10.10.2026 (Stephans Wunsch): gespiegelt (Griff und Haken rechts, Text rechtsbündig), so schmal wie der
   längste Zeilenname, leicht durchsichtig mit Weichzeichner dahinter. Sitzt rechts unter/über dem ☰-Knopf. */
.mg-zeilen-panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--mg-flaeche); background: color-mix(in srgb, var(--mg-flaeche) 40%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--mg-rand); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); padding: 6px; width: max-content; min-width: 0; max-width: calc(100vw - 32px); max-height: calc(100vh - var(--mg-haft-oben, 0px) - 80px); max-height: calc(100dvh - var(--mg-haft-oben, 0px) - 80px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  transform-origin: bottom right; animation: mg-auf .18s ease-out; }
/* Seit 10.10.2026: klappt immer vom ☰-Knopf nach oben auf (Klasse is-oben wird fest gesetzt) und ist so hoch, dass alle
   Zeilen ohne Scrollen passen - die Höchsthöhe oben greift nur auf sehr kleinen Bildschirmen. */
@keyframes mg-auf { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .mg-zeilen-panel { animation: none; } }
.mg-zeilen-panel[hidden] { display: none; }
/* Haftet die Leiste unten am Bildschirm, klappt das Menü nach oben auf */
.mg-zeilen-panel.is-oben { top: auto; bottom: calc(100% + 6px); }
.mg-zeilen-panel h4 { margin: 4px 8px 6px; font-size: 11px; line-height: 1.3; text-align: right; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mg-text-still); }
.mg-zeilen-panel h4 small { display: block; font-size: 10px; font-weight: 500; text-transform: none; letter-spacing: 0; opacity: 0.85; }
.mg-zeilen-panel label { display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 9px; cursor: pointer; font-size: 13.5px; min-height: 40px; text-align: right; white-space: nowrap; }
.mg-zeilen-panel label:hover { background: var(--mg-flaeche2); }
.mg-zeilen-panel input { width: 20px; height: 20px; flex: none; accent-color: var(--mg-akzent); }
.mg-zeilen-panel .mg-punkt { width: 9px; height: 9px; border-radius: 50%; flex: none; }
/* Zeilen im Menü lassen sich mit dem Griff links umsortieren */
.mg-zliste { touch-action: pan-y; }
.mg-zeile { display: flex; flex-direction: row-reverse; align-items: center; border-radius: 9px; }
.mg-zeile label { flex: 1; min-width: 0; }
.mg-zeile:hover { background: var(--mg-flaeche2); }
.mg-zeile.is-zieht { background: var(--mg-flaeche2); opacity: 0.85; outline: 1px dashed var(--mg-akzent); }
.mg-griff { flex: none; width: 26px; text-align: center; color: var(--mg-text-still); cursor: grab; font-size: 14px; line-height: 1; user-select: none; -webkit-user-select: none; touch-action: none; }
.mg-zeile.is-zieht .mg-griff { cursor: grabbing; }

/* ---- Ansichten: Webcam, Satellit, Regen ---- */
.mg-ansichten { display: flex; justify-content: center; gap: 6px; padding: 12px 14px 10px; flex-wrap: wrap; }
.mg-atab { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--mg-rand); background: var(--mg-flaeche2);
  color: var(--mg-text-still); font: 600 13px/1 var(--mg-serif); cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.mg-atab.is-on { border-color: var(--mg-akzent); color: var(--mg-text); background: var(--mg-flaeche); }

/* ---- Satelliten- und Regenkarte ---- */
.mg-karte { position: relative; margin: 0 auto 10px; width: calc(100% - 28px); max-height: 380px; border-radius: 12px; overflow: hidden;
  background: #0a1018; border: 1px solid var(--mg-rand); }
.mg-karte[hidden] { display: none; }
.mg-karte img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
/* Keine Aufhell-Überlagerung: auf weißen Tageswolken wäre das Grün sonst
   unsichtbar. Die Niederschlagsflächen bringen ihre eigene Durchsicht mit. */
.mg-k-auflage { }
.mg-k-auflage[hidden] { display: none; }
.mg-play { position: absolute; left: 10px; top: 10px; width: 42px; height: 42px; border-radius: 50%; border: 0;
  background: rgba(0,0,0,0.55); color: #fff; font-size: 15px; cursor: pointer; backdrop-filter: blur(3px); -webkit-tap-highlight-color: transparent; }
.mg-play:active { transform: scale(0.94); }
.mg-karte.is-film .mg-play { background: var(--mg-akzent); color: #06222a; }

/* ---- Webcam-Bild ---- */
.mg-cam { position: relative; margin: 0 auto 10px; border-radius: 12px; overflow: hidden; background: var(--mg-flaeche2); border: 1px solid var(--mg-rand); height: clamp(120px, 40vw, 240px); width: calc(100% - 28px); }
.mg-cam img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .3s; }
.mg-cam.is-leer img { opacity: 0.25; filter: grayscale(1); }
/* Bildunterschrift immer einzeilig (08.10.2026): der Name wird notfalls mit … gekuerzt, Uhrzeit und Quelle bleiben ganz */
.mg-cam-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; font-size: 12.5px; color: #fff; background: linear-gradient(0deg, rgba(0,0,0,0.72), rgba(0,0,0,0));
  display: flex; align-items: baseline; white-space: nowrap; }
.mg-cam-text > b { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mg-cam-rest { flex: 0 0 auto; }
.mg-cam.is-leer .mg-cam-text { background: none; color: var(--mg-text-still); top: 0; display: flex; align-items: center; justify-content: center; text-align: center; white-space: normal; }
/* Umschalter zwischen mehreren Kameras eines Orts, oben rechts im Bild */
.mg-camwahl { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
.mg-camwahl[hidden] { display: none; }
.mg-camtab { min-height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.5); color: #fff; font: 600 12px/1 var(--mg-serif); cursor: pointer; backdrop-filter: blur(3px); -webkit-tap-highlight-color: transparent; }
.mg-camtab.is-on { background: rgba(255,255,255,0.92); color: #111; border-color: transparent; }
.mg-live { display: inline-block; background: #c0392b; color: #fff; border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; }
.mg-camhint { opacity: 0.85; font-size: 11.5px; }

/* ---- Diagrammfläche ---- */
.mg-wrap { position: relative; border-top: 1px solid var(--mg-rand); border-bottom: 1px solid var(--mg-rand); }
/* touch-action: Wischen in beide Richtungen bleibt, aber Zwei-Finger- und Doppeltipp-Zoom
   der Seite sind aus - die Gesten gehören hier dem Diagramm */
.mg-scroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; cursor: grab; overscroll-behavior-x: contain; touch-action: pan-x pan-y; }
.mg-scroll::-webkit-scrollbar { display: none; }
.mg-svgwrap { position: relative; }
.mg-svg { display: block; }
.mg-achse { position: absolute; left: 0; top: 0; width: 46px; pointer-events: none; background: var(--mg-flaeche); border-right: 1px solid var(--mg-rand); }
.mg-ax-titel { position: absolute; left: 0; padding: 0 10px 0 8px; background: var(--mg-flaeche2); border-radius: 0 6px 6px 0; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--mg-text-still); white-space: nowrap; }
.mg-ax-titel small { font-weight: 600; letter-spacing: 0; }
.mg-ax-punkt { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.mg-ax-tick { position: absolute; right: 8px; font-family: var(--mg-mono); font-size: 11px; color: var(--mg-text-still); line-height: 14px; }
.mg-ax-wert { position: absolute; right: 3px; font-family: var(--mg-mono); font-size: 11px; font-weight: 700; line-height: 14px; padding: 1px 3px; border-radius: 4px; background: var(--mg-flaeche); box-shadow: 0 0 0 1px currentColor; z-index: 1; }
.mg-ax-wert[hidden] { display: none; }
.mg-ax-datum { position: absolute; left: 0; padding: 0 10px 0 8px; display: flex; align-items: center; background: var(--mg-flaeche); font-size: 12px; font-weight: 700; color: var(--mg-text); white-space: nowrap; border-radius: 0 6px 6px 0; }
.mg-cursor { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; border-left: 2px solid var(--mg-text); opacity: 0.85; pointer-events: none; }
.mg-cursor::before { content: ""; position: absolute; top: 0; left: -6px; border: 5px solid transparent; border-top: 7px solid var(--mg-text); }

/* ---- Schwebende Helfer im Diagramm ---- */
/* Zoom-Ecke: − 🔍 + rechts unten über der Zeitachse, halb durchsichtig */
/* Der Halter steht am Ende des Diagramm-Blocks und haftet am unteren Bildrand (über der Knopfleiste),
   solange das Diagramm nach unten über den Bildschirm hinausragt. */
.mg-ecke-halter { position: sticky; bottom: calc(var(--mg-haft-unten) + 64px); z-index: 3; height: 0; }
.mg-ecke { position: absolute; right: 8px; bottom: 8px; display: inline-flex; align-items: stretch; border: 1px solid var(--mg-rand); border-radius: var(--mg-r); overflow: hidden;
  background: rgba(27,33,36,0.5); background: color-mix(in srgb, var(--mg-flaeche) 50%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.mg-ecke .mg-btn { min-height: 30px; min-width: 32px; padding: 0 7px; border: 0; border-radius: 0; background: transparent; }
.mg-ecke .mg-btn .mg-i { width: 15px; height: 15px; }
.mg-ecke-lupe { display: inline-flex; align-items: center; padding: 0 5px; color: var(--mg-text-still); }
.mg-ecke-lupe .mg-i { width: 13px; height: 13px; }
.mg-ecke > * + * { border-left: 1px solid var(--mg-rand); }
/* Rand-Pfeil zurück zu jetzt: erscheint nur, wenn "jetzt" aus dem Bild gewischt ist */
.mg-randpfeil { position: absolute; top: var(--mg-sicht-mitte, 50%); transform: translateY(-50%); z-index: 3; display: none; align-items: center; min-height: 36px; padding: 0 7px; gap: 1px;
  border: 1px solid var(--mg-rand); border-radius: var(--mg-r); color: var(--mg-text); cursor: pointer; -webkit-tap-highlight-color: transparent;
  background: rgba(27,33,36,0.88); background: color-mix(in srgb, var(--mg-flaeche) 88%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.mg-randpfeil .mg-i { width: 16px; height: 16px; }
.mg-randpfeil-l { left: 52px; }   /* rechts neben der Werte-Achse */
.mg-randpfeil-r { right: 8px; }
.mg-randpfeil.is-da { display: inline-flex; }
/* Hinweis beim Zoomen: "1 Tag im Bild", kurz eingeblendet */
.mg-zoomhinweis { position: absolute; left: 50%; top: var(--mg-sicht-mitte, 50%); transform: translate(-50%, -50%); z-index: 4; padding: 7px 12px; border-radius: 8px; white-space: nowrap;
  background: var(--mg-text); color: var(--mg-flaeche); font: 600 13px/1 var(--mg-serif); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.mg-zoomhinweis.is-da { opacity: 0.92; }
@media (prefers-reduced-motion: reduce) { .mg-zoomhinweis { transition: none; } }
.mg-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 14px 10px; font-size: 11.5px; color: var(--mg-text-still); }

/* ---- Innereien der Zeichnung ---- */
.mg-svg text { font-family: var(--mg-mono); font-size: 11px; fill: var(--mg-text-still); }
.mg-svg .mg-datum { font-family: var(--mg-serif); font-weight: 700; fill: var(--mg-text); font-size: 12px; }
.mg-svg .mg-titelband { fill: var(--mg-flaeche2); }
.mg-svg .mg-tagesband { fill: var(--mg-flaeche2); }
.mg-svg .mg-nacht { fill: rgba(10,16,30,0.28); }
.mg-svg .mg-grid { stroke: var(--mg-rand); stroke-width: 1; }
.mg-svg .mg-huelle { fill: none; stroke-width: 1.2; stroke-dasharray: 1.5 3.5; stroke-linecap: round; opacity: 0.8; }
.mg-svg .mg-wertlinie { stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.9; }
/* Punkte auf den Kurven: eigene Ebene ueber dem schwarzen Strich (08.10.2026) */
.mg-punkte { position: absolute; inset: 0; pointer-events: none; }
.mg-wpunkt { position: absolute; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 1.5px var(--mg-flaeche); }
.mg-wpunkt[hidden] { display: none; }
.mg-svg .mg-tag { stroke: var(--mg-text-still); stroke-width: 1; opacity: 0.6; }
.mg-svg .mg-balken { opacity: 0.9; }
.mg-svg .mg-balken2 { opacity: 0.32; }
.mg-svg .mg-linie { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.mg-svg .mg-linie2 { fill: none; stroke-width: 1.6; stroke-dasharray: 4 3; opacity: 0.8; }
.mg-svg .mg-flaeche { opacity: 0.16; }
.mg-svg .mg-mark { fill: var(--mg-text); font-size: 10.5px; font-weight: 700; paint-order: stroke; stroke: var(--mg-flaeche); stroke-width: 3px; stroke-linejoin: round; }
.mg-svg .mg-sonne { fill: var(--ochre, #e0a24f); font-weight: 700; font-size: 10.5px; }
.mg-svg .mg-tagesinfo { font-size: 10.5px; }
.mg-svg .mg-tagesinfo-stark { font-size: 11px; font-weight: 700; fill: var(--mg-text); }
.mg-svg .mg-jetzt { stroke: var(--mg-akzent); stroke-width: 1.5; stroke-dasharray: 4 3; }
.mg-svg .mg-jetzt-t { fill: var(--mg-akzent); font-weight: 700; }
.mg-svg .mg-cam-mark { fill: var(--ochre, #e0a24f); opacity: 0.85; }
.mg-svg .mg-cam-mark.is-live { fill: #e05a45; }
.mg-svg .mg-pfeil { stroke: none; }
/* Umsortieren durch langes Drücken im Diagramm */
.mg-wrap.mg-sortiert { cursor: grabbing; }
.mg-wrap.mg-sortiert .mg-scroll { touch-action: none; }
.mg-svg .mg-sortpack { fill: var(--mg-akzent); opacity: 0.16; }
.mg-svg .mg-sortziel { stroke: var(--mg-akzent); stroke-width: 3; }

@media (max-width: 560px) {
  .mg-tabs { flex: 1 1 auto; }
  .mg-tab { flex: 1; padding: 0 6px; text-align: center; font-size: 13px; }
  .mg-zeilenwahl { position: static; }
  .mg-zeilen-panel { left: auto; right: 8px; min-width: 0; max-width: calc(100vw - 16px); }
}

/* ---- Tipps zum Tag unter dem Diagramm (wahlfrei, cfg.tipps) ----
   Schlichte Zeilen wie die Werteliste: Symbol, fetter Name, Klartext. */
.mg-tipps { padding: 10px 14px 4px; margin-top: 10px; border-top: 1px solid var(--mg-rand); }
.mg-tipps[hidden] { display: none; }
.mg-tipps-kopf { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mg-text-still); margin: 0 0 4px; }
.mg-tipp { display: flex; gap: 9px; align-items: baseline; padding: 5px 0; font-size: 13.5px; line-height: 1.45; border-bottom: 1px solid var(--mg-rand); }
.mg-tipp:last-child { border-bottom: 0; }
.mg-tipp-i { flex: none; width: 1.3em; text-align: center; }
.mg-tipp b { font-weight: 700; }
.mg-tipp-alt { color: var(--mg-text-still); font-size: 12.5px; }

/* ---- Zeitraffer (wahlfrei, cfg.filmLeiste) ----
   Play/Pause vorn in der Bildleiste; beim Abspielen erscheint unter dem Bild eine
   schmale Leiste mit Fortschritt, Zeitraum und Tempo. Auswahl wie die übrigen
   Umschalter: Text mit Strich darunter, keine Kästchen. */
.mg-filmknopf { min-width: 44px; padding: 0 10px; font-size: 14px; color: var(--mg-text); }
.mg-filmknopf.is-on { border-color: var(--mg-akzent); color: var(--mg-akzent); background: var(--mg-flaeche); }
.mg-film { padding: 2px 14px 8px; }
.mg-film[hidden] { display: none; }
.mg-film-balken { height: 3px; background: var(--mg-rand); border-radius: 2px; overflow: hidden; margin: 0 0 7px; }
.mg-film-balken i { display: block; height: 100%; background: var(--mg-akzent); transition: width .25s linear; }
.mg-film-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--mg-text-still); }
.mg-film-kopf b { color: var(--mg-text); }
.mg-film-ende { border: 0; background: none; color: var(--mg-akzent); font: 700 12.5px/1 var(--mg-serif); padding: 6px 0; cursor: pointer; }
.mg-film-zeile { display: flex; align-items: baseline; gap: 2px 14px; flex-wrap: wrap; margin-top: 2px; }
.mg-film-was { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mg-text-still); min-width: 74px; }
.mg-film-wahl { border: 0; background: none; color: var(--mg-text-still); font: 600 13px/1 var(--mg-serif); padding: 8px 1px 6px; border-bottom: 2px solid transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mg-film-wahl.is-on { color: var(--mg-text); border-bottom-color: var(--mg-akzent); }

/* ---- Links in der Knopfleiste (10.10.2026): ↻ schmal, daneben die Farbwahl ---- */
.mg-links { display: inline-flex; align-items: center; gap: 6px; }
.mg-btn-frisch { min-width: 40px; padding: 0 8px; }
.mg-farbwahl { position: relative; }
.mg-farb-panel { position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 30; width: max-content; padding: 6px; border: 1px solid var(--mg-rand); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  background: var(--mg-flaeche); background: color-mix(in srgb, var(--mg-flaeche) 60%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transform-origin: bottom left; animation: mg-auf .18s ease-out; }
.mg-farb-panel[hidden] { display: none; }
.mg-farb-panel h4 { margin: 4px 8px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mg-text-still); }
.mg-farb-wahl { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 10px 6px 8px; border: 0; border-radius: 9px; background: transparent; color: var(--mg-text); font: 500 13.5px/1 var(--mg-serif); cursor: pointer; text-align: left; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.mg-farb-wahl:hover { background: var(--mg-flaeche2); }
.mg-farb-wahl.is-on { background: var(--mg-flaeche2); box-shadow: inset 2px 0 0 var(--mg-akzent); }
.mg-farb-wahl i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--mg-rand); flex: none; }

/* ---- Player (10.10.2026): Webcam/Satellit/Regen groß, mit Zoom und Spulleiste ---- */
.mg-bild-player { position: absolute; left: 8px; top: 8px; z-index: 2; width: 34px; height: 34px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.5); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(3px); -webkit-tap-highlight-color: transparent; }
.mg-bild-player .mg-i { width: 17px; height: 17px; }
.mg-karte .mg-play ~ .mg-bild-player { left: 58px; }
.mg-player { position: fixed; inset: 0; z-index: 200; background: #000; color: #fff; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); font-family: var(--mg-serif); }
.mg-player[hidden] { display: none; }
.mg-player .mg-bild-player { display: none; }
.mg-pl-kopf { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; }
.mg-pl-tabs { display: flex; gap: 6px; }
.mg-pl-tab { min-height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff; font: 600 13px/1 var(--mg-serif); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mg-pl-tab.is-on { background: #fff; color: #000; border-color: #fff; }
.mg-pl-x { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mg-pl-buehne { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; }
.mg-pl-bild { width: 100%; transform-origin: center center; will-change: transform; }
.mg-player .mg-karte, .mg-player .mg-cam { width: 100%; max-height: none; margin: 0; border: 0; border-radius: 0; }
.mg-player .mg-cam { height: auto; background: #000; }
.mg-player .mg-cam img { height: auto; max-height: 72vh; object-fit: contain; }
.mg-player .mg-karte { max-height: 72vh; }
.mg-player .mg-cam-text { font-size: 13px; }
.mg-pl-leiste { padding: 6px 12px 8px; }
.mg-pl-zeile1 { display: flex; align-items: center; gap: 8px; }
.mg-pl-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mg-pl-pp { width: 46px; height: 46px; background: #fff; color: #000; border-color: #fff; }
.mg-pl-spur { flex: 1; min-width: 0; height: 30px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
.mg-pl-spur::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--mg-akzent) var(--mg-anteil, 0%), rgba(255,255,255,0.3) var(--mg-anteil, 0%)); }
.mg-pl-spur::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; background: #fff; border: 2px solid var(--mg-akzent); box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.mg-pl-spur::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); }
.mg-pl-spur::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--mg-akzent); }
.mg-pl-spur::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--mg-akzent); }
.mg-pl-zeit { font-family: var(--mg-mono); font-size: 14px; font-weight: 700; min-width: 44px; text-align: right; }
.mg-pl-zeile2 { display: flex; align-items: baseline; gap: 2px 12px; margin-top: 2px; flex-wrap: wrap; }
.mg-player .mg-film-wahl { color: rgba(255,255,255,0.65); }
.mg-player .mg-film-wahl.is-on { color: #fff; }
.mg-pl-was { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,0.6); }
.mg-pl-tipp { margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.5); white-space: nowrap; }

/* ---- css/wetter.css ---- */
/* WetterPro Fuerte – Reiter „Wetter" (Aufbau wie WeatherPro, Optik der Fuerte-Seite) */

/* Aktuell: ruhiger Kasten mit zwei Spalten */
.wx-aktuell { display:grid; grid-template-columns:1fr 1fr; margin:12px 12px 0; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
.wx-akt-l { padding:10px 12px; border-right:1px solid var(--border); position:relative; min-height:212px; }
.wx-lab { font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--ink-dim); }
.wx-lab span { color:var(--ink-dim); margin-right:8px; }
.wx-akt-l > .sym { width:112px; height:112px; margin:16px auto 0; }
.wx-temp { position:absolute; left:12px; bottom:8px; color:var(--wert); font-size:40px; font-weight:700; letter-spacing:-1.5px; line-height:1; }
.wx-rg { position:absolute; right:10px; bottom:14px; font-size:13.5px; display:flex; align-items:center; gap:4px; color:var(--ink-dim); }
.wx-rg .ic { color:var(--teal); }
.wx-rg small { font-size:11px; }
.wx-akt-r { padding:14px 12px 10px; font-size:14px; }
.wx-lage { text-align:center; margin-bottom:16px; font-weight:600; font-size:15px; }
.wx-row { display:flex; justify-content:space-between; line-height:1.6; color:var(--ink-dim); }
.wx-row span + span { color:var(--ink); font-family:var(--zahlen); }
.wx-wind { display:flex; justify-content:space-between; align-items:flex-end; margin-top:14px; }
.wx-w { display:flex; gap:6px; align-items:flex-end; }
.wx-w .windrose { width:32px; height:32px; color:var(--ink); }
.wx-w div { line-height:1.05; font-size:13px; color:var(--ink-dim); }
.wx-w div b { font-size:19px; font-weight:700; display:block; color:var(--ink); }
.wx-boe { text-align:right; font-size:13px; line-height:1.3; color:var(--ink-dim); }

/* Stundenspalten */
.wx-stunden { display:flex; margin:12px 12px 0; background:var(--surface); border:1px solid var(--border); border-radius:12px; }
.wx-stunde { flex:0 0 33.34%; border-right:1px solid var(--border); padding:8px 10px; }
.wx-stunde:last-child { border-right:0; }
.wx-h { font-size:13px; color:var(--ink-dim); font-weight:600; }
.wx-stunde .sym { width:60px; height:60px; margin:6px auto 4px; }
.wx-u { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--ink-dim); }
.wx-u span { display:inline-flex; align-items:center; gap:3px; white-space:nowrap; }
.wx-u .ic { color:var(--teal); }
.wx-u b { color:var(--ink); font-size:17px; font-weight:700; }

/* Tagesliste */
.wx-tage { margin:12px 12px 12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.wx-tag { display:grid; grid-template-columns:56px 62px 66px minmax(0,1fr) 40px 38px 64px; align-items:center; padding:8px 6px 8px 10px; border-bottom:1px solid var(--border); font-size:14px; cursor:pointer; }
.wx-tag:last-child { border-bottom:0; }
.wx-tag.wx-heute { box-shadow:inset 3px 0 0 var(--akzent); }
.wx-d { font-size:16px; font-weight:700; line-height:1.15; }
.wx-d span { display:block; color:var(--ink-dim); font-size:12.5px; font-weight:400; }
.wx-tag > .sym { width:44px; height:44px; justify-self:center; }
.wx-tt { font-size:15px; line-height:1.25; color:var(--ink-dim); }
.wx-tt b { display:block; color:var(--wert); font-weight:700; font-size:17px; }
.wx-zus { font-size:12.5px; line-height:1.25; padding-left:0; color:var(--ink-dim); }
.wx-zus div { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.wx-zus b { color:var(--ink); font-weight:600; }
.wx-zus .ic { color:var(--teal); }
.wx-tag .wx-w, .wx-sz .wx-w { align-items:center; justify-content:flex-end; font-size:12px; }
.wx-tag .wx-w .windrose, .wx-sz .wx-w .windrose { width:28px; height:28px; }
.wx-tag .wx-w div b, .wx-sz .wx-w div b { font-size:15px; }

/* Tagesdetail: Nacht / Tag / Nacht */
.wx-detail { padding:12px 12px 16px; }
.wx-spalten { display:grid; grid-template-columns:1fr 2fr 1fr; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.wx-sp { padding:10px 8px 12px; text-align:center; }
.wx-sp + .wx-sp { border-left:1px solid var(--border); }
.wx-sp-tag { background:var(--surface-2); }
.wx-sp-t { font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--ink-dim); margin-bottom:8px; }
.wx-sp-nacht .sym { width:60px; height:60px; margin:0 auto 6px; }
.wx-sp-temp { font-size:20px; font-weight:700; margin:4px 0 8px; }
.wx-sp-tag .wx-sp-temp { color:var(--wert); }
.wx-sp-zus { font-size:13px; line-height:1.5; display:inline-block; text-align:left; color:var(--ink-dim); }
.wx-sp-zus div { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.wx-sp-zus b { color:var(--ink); font-weight:600; }
.wx-sp-zus .ic { color:var(--teal); }
.wx-sp-oben { display:flex; justify-content:center; align-items:center; gap:14px; }
.wx-sp-oben .sym { width:68px; height:68px; }
.wx-sp-wind { text-align:center; font-size:12.5px; line-height:1.1; color:var(--ink-dim); }
.wx-sp-wind .windrose { width:38px; height:38px; margin:0 auto 2px; color:var(--ink); }
.wx-sp-wind b { font-size:17px; font-weight:700; color:var(--ink); }
.wx-sp-boe { margin-top:6px; font-size:12.5px; }
.wx-sp-boe b { font-size:13.5px; }
.wx-sp-unten { display:flex; justify-content:space-around; align-items:flex-start; gap:8px; margin-top:6px; }
.wx-sp-unten .wx-sp-temp { margin-bottom:4px; }
.wx-sp-mond { margin-top:6px; padding-top:6px; border-top:1px solid var(--border); }

/* Tagesdetail: Stundenzeilen */
.wx-szs { margin-top:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.wx-sz { display:grid; grid-template-columns:66px 56px 56px minmax(0,1fr) 66px; align-items:center; padding:9px 10px; border-bottom:1px solid var(--border); font-size:14px; }
.wx-sz:last-child { border-bottom:0; }
.wx-sz.is-jetzt { box-shadow:inset 3px 0 0 var(--akzent); }
.wx-sz-z { font-size:12.5px; line-height:1.2; color:var(--ink-dim); }
.wx-sz-z b { display:block; color:var(--ink); font-weight:600; font-size:14px; }
.wx-sz > .sym { width:42px; height:42px; }
.wx-sz-temp { font-size:17px; font-weight:700; }

.wx-mond { display:grid; justify-items:center; gap:0; font-size:11px; color:var(--ink-dim); line-height:1.1; cursor:pointer; }
.wx-mond .sym { width:38px; height:38px; }
.wx-luft { display:grid; justify-items:center; gap:2px; font-size:11px; color:var(--ink-dim); line-height:1.1; }
.wx-luft .sym { width:28px; height:28px; color:var(--ink); }

/* ---- css/graphs.css ---- */
/* WetterPro Fuerte – Reiter „Graphs": Stephans Meteogramm-Baustein (gemeinsam/meteogramm.js).
   Der Baustein nimmt die Seitenfarben über --surface, --ink, --teal … von selbst. */
.g-wrap { padding:12px 12px 16px; }
.g-wrap .mg { border-radius:12px; border:1px solid var(--border); box-shadow:var(--shadow); }
.g-wrap .mg-top { padding-top:0; }
.g-wrap .mg-tabs { display:none; }             /* nur ein Ort, nur ein Modell – die Reiter sind leer */
.g-wrap .mg-cam, .g-wrap .mg-ansichten { display:none !important; }   /* keine Kamera in dieser App */
.g-wrap .mg-readout { top:var(--mg-haft-oben); }
.g-kopf { display:flex; justify-content:space-between; align-items:baseline; padding:12px 14px 8px; }
.g-kopf b { font-size:16px; font-weight:700; letter-spacing:-0.015em; }
.g-kopf span { font-size:11.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }

/* ---- ../gemeinsam/wpkarte.css ---- */
/* WetterKarte – gemeinsamer Kartenbaustein (Reiter „Karten" und „Rad/Sat").
   Farben über Variablen, Vorgabe = WeatherPro-Blau. Eine App setzt die --wk-* am Container oder an :root um. */
.wk {
  --wk-leiste: var(--kopf, #0f4a94);        /* Ebenenleiste rechts */
  --wk-leiste-an: var(--hell, #2069c4);     /* aktiver Knopf */
  --wk-zeit: var(--leiste, #0c2e5c);        /* Zeitleiste unten */
  --wk-text: #fff;
  --wk-still: var(--dim, #c6d5ea);
  --wk-akzent: var(--gelb, #ffd633);
  --wk-rand: var(--linie, rgba(255,255,255,.22));
  --wk-hoehe: calc(100dvh - 190px);
  display: flex; flex-direction: column; height: var(--wk-hoehe); min-height: 340px; color: var(--wk-text);
  font-variant-numeric: tabular-nums; position: relative;
}
.wk-oben { flex: 1; min-height: 0; display: flex; }
.wk-karte { flex: 1; min-width: 0; position: relative; background: #7fa7c9; }
.wk-karte .leaflet-container { width: 100%; height: 100%; background: #7fa7c9; font: inherit; }
.wk-karte .leaflet-container a { color: inherit; }

/* Ebenenleiste rechts */
.wk-leiste { width: 56px; flex: none; display: flex; flex-direction: column; background: var(--wk-leiste); border-left: 0.5px solid var(--wk-rand); overflow-y: auto; scrollbar-width: none; }
.wk-leiste::-webkit-scrollbar { display: none; }
.wk-knopf { width: 56px; height: 52px; flex: none; border: 0; border-bottom: 0.5px solid var(--wk-rand); background: none; display: grid; place-items: center; cursor: pointer; color: var(--wk-still); -webkit-tap-highlight-color: transparent; }
.wk-knopf svg { width: 26px; height: 26px; display: block; }
.wk-knopf.is-on { background: var(--wk-leiste-an); color: var(--wk-text); }
.wk-knopf:disabled { opacity: .35; cursor: default; }
.wk-knopf:focus-visible { outline: 2px solid var(--wk-akzent); outline-offset: -3px; }
.wk-trenner { flex: 1; min-height: 8px; }

/* Zeitleiste unten */
.wk-zeit { background: var(--wk-zeit); padding: 6px 10px 10px; border-top: 0.5px solid var(--wk-rand); }
.wk-regler { display: flex; align-items: center; gap: 2px; }
.wk-tk { width: 40px; height: 40px; border: 0; background: none; color: var(--wk-text); display: grid; place-items: center; cursor: pointer; flex: none; -webkit-tap-highlight-color: transparent; }
.wk-tk svg { width: 18px; height: 18px; display: block; }
.wk-tk:disabled { opacity: .35; }
.wk-spur { flex: 1; min-width: 0; position: relative; padding: 0 2px 30px; }
.wk-range { width: 100%; margin: 0; display: block; accent-color: #fff; height: 28px; }
.wk-ticks { position: absolute; left: 10px; right: 10px; bottom: 16px; height: 14px; font-size: 10.5px; color: var(--wk-still); pointer-events: none; }
.wk-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.wk-ticks span::before { content: ""; display: block; width: 0.5px; height: 4px; background: var(--wk-still); margin: 0 auto 1px; }
.wk-tage { position: absolute; left: 10px; right: 10px; bottom: 0; height: 14px; font-size: 11px; font-weight: 600; color: var(--wk-text); pointer-events: none; }
.wk-tage span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.wk-tage span.is-heute { color: var(--wk-akzent); }
.wk-lade { position: absolute; right: 8px; top: 44px; z-index: 500; font-size: 11.5px; color: var(--wk-still); background: rgba(0,0,0,.45); padding: 2px 7px; pointer-events: none; }

/* Marken */
.wk-mk { background: none; border: 0; }
.wk-marke { position: absolute; left: 0; top: 0; font-size: 12.5px; line-height: 1.15; white-space: nowrap; color: #fff;
  text-shadow: 0 0 3px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.7); pointer-events: none; }
.wk-marke i { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 0.5px solid rgba(0,0,0,.6); box-shadow: 0 0 3px rgba(0,0,0,.6); }
.wk-marke .wk-name { position: absolute; left: 8px; top: -8px; font-weight: 500; }
.wk-marke .wk-w { position: absolute; right: 7px; top: -34px; display: flex; align-items: center; gap: 1px; }
.wk-marke .wk-w svg { width: 34px; height: 34px; display: block; filter: drop-shadow(0 0 2px rgba(0,0,0,.9)); }
.wk-marke .wk-w b { font-size: 14px; font-weight: 500; }
.wk-marke.is-hier i { width: 12px; height: 12px; left: -6px; top: -6px; background: var(--wk-akzent); box-shadow: 0 0 0 3px rgba(255,214,51,.3); }
.wk-marke.is-hier .wk-name { color: var(--wk-akzent); font-weight: 600; font-size: 13.5px; }
.wk-marke.is-hier .wk-w { top: -38px; }
.wk-marke.is-hier .wk-w svg { width: 40px; height: 40px; }
.wk-marke.is-hier .wk-w b { font-size: 16px; }
.wk-ohne-wetter .wk-marke .wk-w { display: none; }

/* Flächen und Bilder */
.wk-flaeche { image-rendering: auto; }
.wk-basis-bild { image-rendering: auto; }

/* Quellen, Hinweise, Legende */
.wk-quelle { position: absolute; left: 6px; bottom: 4px; z-index: 500; font-size: 10px; letter-spacing: .04em; color: rgba(255,255,255,.85); text-shadow: 0 0 3px rgba(0,0,0,.95); pointer-events: none; }
.wk-hinweis { position: absolute; left: 12px; right: 12px; bottom: 22px; z-index: 500; text-align: center; font-size: 12.5px; line-height: 1.4; color: #fff; padding: 6px 10px; background: rgba(11,26,46,.8); pointer-events: none; }
.wk-legende { position: absolute; left: 6px; top: 6px; z-index: 500; font-size: 10.5px; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.95); pointer-events: none; display: flex; align-items: center; gap: 6px; }
.wk-legende i { display: block; width: 110px; height: 8px; border: 0.5px solid rgba(0,0,0,.5); }
.wk-titel { position: absolute; right: 6px; top: 6px; z-index: 500; font-size: 11px; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.95); pointer-events: none; text-align: right; line-height: 1.25; }
.wk-titel b { display: block; font-size: 12.5px; }

/* Leaflet-Feinheiten */
.wk .leaflet-control-attribution { display: none; }
.wk .leaflet-marker-icon { transition: none; }
.wk .leaflet-image-layer { pointer-events: none; }

/* ---- css/karten.css ---- */
/* WetterPro Fuerte – Reiter „Karten" und „Rad/Sat": Höhe des Kartenbausteins (Kopfzeile 52 px + Reiterleiste 58 px).
   Der Baustein sitzt direkt auf der Reiterfläche (.pane bekommt die Klasse .wk). */
.pane[data-pane="karten"], .pane[data-pane="radsat"] { min-height:0; }
.pane[data-pane="karten"].wk, .pane[data-pane="radsat"].wk {
  --wk-hoehe: calc(100dvh - 52px - 58px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
@supports not (height: 100dvh) {
  .pane[data-pane="karten"].wk, .pane[data-pane="radsat"].wk { --wk-hoehe: calc(100vh - 110px); }
}
/* Wenn der Hinweis „Gespeicherter Stand" über der Fläche steht, wird die Karte um dessen Höhe kürzer */
body:has(#snapshot-hinweis:not([hidden])) .pane[data-pane="karten"].wk,
body:has(#snapshot-hinweis:not([hidden])) .pane[data-pane="radsat"].wk {
  --wk-hoehe: calc(100dvh - 52px - 58px - 26px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}

/* Fuerte-Optik: Schrift der Karte folgt hell/dunkel */
.wk { --wk-text: var(--ink); }

</style>
