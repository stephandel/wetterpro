<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1620">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Zenit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ---- css/zenit.css ---- */
/* Zenit – Gestaltung. Sand und Nachtmeer, Türkis als Akzent, Vulkan-Ocker für Wärme.
   Schrift: Inter für alles (seit 01.10.2026; vorher Fraunces + Plus Jakarta Sans). Ecken sanft, keine Kacheln, keine Pillen. */
:root {
  --bg:#efe8d8; --surface:#f8f4ea; --surface2:#e8dfcc; --border:#d3c9b3; --hair:rgba(16,32,42,.14);
  --ink:#10202a; --dim:#5d6b72; --accent:#0891a0; --accent-soft:rgba(8,145,160,.13); --warm:#c26520; --rain:#2f6fcf; --warn:#c8432f;
  --shadow:0 1px 2px rgba(16,32,42,.06), 0 10px 30px -18px rgba(16,32,42,.35);
  /* Schrift (Stephans Wunsch 01.10.2026): Inter für alles – klar und ruhig; große Zahlen sehr leicht, Überschriften kräftig */
  --display:"Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --sans:"Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --r:10px;
  /* Karten-Modul (karten.css) nutzt diese Namen */
  --kopf:#0f2236; --hell:#183149; --linie:rgba(255,255,255,.22); --gelb:#f0c75a; --leiste:#0a1722; --blau:#0f2236;
  color-scheme:light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme:dark;
    --bg:#0b1620; --surface:#122029; --surface2:#182a35; --border:#263a46; --hair:rgba(236,241,242,.14);
    --ink:#ecf1f2; --dim:#97a9b0; --accent:#1aa5b0; --accent-soft:rgba(26,165,176,.16); --warm:#cf7a3c; --rain:#5a9be6; --warn:#f0705d;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --bg:#0b1620; --surface:#122029; --surface2:#182a35; --border:#263a46; --hair:rgba(236,241,242,.14);
  --ink:#ecf1f2; --dim:#97a9b0; --accent:#1aa5b0; --accent-soft:rgba(26,165,176,.16); --warm:#cf7a3c; --rain:#5a9be6; --warn:#f0705d;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7);
}

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.5 var(--sans); font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }
button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; background:none; border:0; padding:0; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
svg { display:block; }
h1, h2, h3 { font-family:var(--display); font-weight:600; letter-spacing:-.025em; margin:0; text-wrap:balance; }
.ic { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.ic.klein { width:14px; height:14px; }
.wrap { max-width:560px; margin:0 auto; padding-inline:16px; }
.scroll { overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.scroll::-webkit-scrollbar { display:none; }
.eyebrow { font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:700; }
.app { min-height:100%; display:flex; flex-direction:column; }
.screen { flex:1; }

/* ---- Kopf ---- */
.top { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--hair); padding-top:env(safe-area-inset-top,0px); }
.top > .wrap { display:flex; align-items:center; gap:10px; min-height:52px; }
.marke { font-family:var(--display); font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1; }
.marke i { font-style:normal; font-weight:300; color:var(--accent); }
.ortwahl { flex:1; min-width:0; display:grid; text-align:left; line-height:1.15; padding:6px 8px; border-radius:8px; }
.ortwahl:hover { background:var(--accent-soft); }
.ortwahl b { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ortwahl span { font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ik { width:44px; height:44px; display:grid; place-items:center; border-radius:8px; }
.ik:hover { background:var(--accent-soft); }
.nav { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
.nav::-webkit-scrollbar { display:none; }
.nav button { flex:none; padding:8px 10px 9px; font-size:13px; font-weight:600; color:var(--dim); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.nav button.is-on { color:var(--ink); border-bottom-color:var(--accent); }
.hinweisleiste { font-size:12px; color:var(--dim); text-align:center; padding:6px 16px; background:var(--surface2); border-bottom:1px solid var(--hair); }

/* ---- Abschnitte ---- */
section.block { padding-block:30px 6px; display:grid; gap:14px; }
section.block > * { min-width:0; }
section.block > header { display:grid; gap:4px; }
section.block h2 { font-size:25px; }
section.block h2 em { font-style:normal; font-weight:300; color:var(--accent); }
section.block > header p { margin:0; color:var(--dim); font-size:14px; max-width:60ch; }
.laden { padding:60px 20px; text-align:center; color:var(--dim); font-size:14px; }
.fehler { margin:20px 16px; padding:14px 16px; border:1px solid var(--warn); border-radius:var(--r); font-size:14px; line-height:1.5; }
.fehler button { margin-top:10px; border:1px solid var(--border); padding:8px 14px; border-radius:8px; font-weight:600; }
.karte-flaeche { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); }

/* ---- Held: Jetzt ---- */
.held { position:relative; color:#fff; overflow:hidden; background:#123; min-height:440px; display:grid; }
.held .laden { color:rgba(255,255,255,.75); align-self:center; }
.himmel { position:absolute; inset:0; width:100%; height:100%; }
.held .schleier { position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,14,22,.05) 0%, rgba(6,14,22,0) 40%, rgba(6,14,22,.62) 100%); pointer-events:none; }
.held-inhalt { position:relative; display:grid; gap:14px; padding-block:22px 18px; align-content:end; min-height:440px; }
.held-ort { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; opacity:.92; }
.held-ort .punkt { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(26,165,176,.3); }
.held-ort span { opacity:.8; font-weight:500; }
.grad { display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; }
.grad .zahl { font-family:var(--display); font-weight:200; font-size:104px; line-height:.88; letter-spacing:-.05em; text-shadow:0 2px 24px rgba(0,0,0,.25); }
.grad .zahl sup { font-size:38px; vertical-align:top; margin-left:2px; font-weight:300; }
.grad .lage { display:grid; gap:3px; padding-top:8px; min-width:0; }
.grad .lage b { font-family:var(--display); font-size:23px; font-weight:500; line-height:1.15; }
.grad .lage span { font-size:13.5px; opacity:.88; }
.grad .lage .sym { width:56px; height:56px; margin:-4px 0 2px -4px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.3)); }
.fakten { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border-top:1px solid rgba(255,255,255,.22); border-bottom:1px solid rgba(255,255,255,.22); }
.fakt { padding:9px 8px 8px 0; display:grid; gap:1px; min-width:0; }
.fakt + .fakt { padding-left:10px; border-left:1px solid rgba(255,255,255,.18); }
.fakt small { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.75; font-weight:700; }
.fakt b { font-family:var(--display); font-size:19px; font-weight:500; line-height:1.15; white-space:nowrap; }
.fakt b i { font-style:normal; font-family:var(--sans); font-size:11.5px; font-weight:600; opacity:.85; margin-left:2px; }
.fakt span { font-size:11.5px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sonnenbogen { position:relative; height:62px; margin-top:2px; }
.sonnenbogen svg { width:100%; height:100%; overflow:visible; }
.sonnenbogen .zeiten { position:absolute; left:0; right:0; bottom:-4px; display:flex; justify-content:space-between; font-size:12px; opacity:.88; }
.sonnenbogen .zeiten span { display:flex; align-items:center; gap:4px; }
.held .stand { display:flex; justify-content:space-between; gap:10px; font-size:11.5px; opacity:.7; flex-wrap:wrap; }
.held .stand button { text-decoration:underline; text-underline-offset:2px; opacity:1; }

/* ---- Was heute geht ---- */
.tipps { display:grid; gap:10px; }
.tipp { display:grid; grid-template-columns:34px minmax(0,1fr); gap:6px 12px; padding:14px 14px 12px; }
.tipp .ic { width:26px; height:26px; color:var(--accent); margin-top:2px; }
.tipp.is-warn .ic { color:var(--warn); }
.tipp.is-vorbei { opacity:.6; }
.tipp h3 { font-size:19px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.tipp h3 span { font-family:var(--sans); font-size:12.5px; color:var(--dim); font-weight:600; }
.tipp p { margin:0; font-size:13.5px; color:var(--ink); line-height:1.45; }
.tipp p b { font-weight:700; }
.tipp .fenster { grid-column:2; display:grid; gap:3px; margin-top:4px; }
.zeitleiste { position:relative; height:8px; background:var(--surface2); border-radius:2px; overflow:visible; }
.zeitleiste i { position:absolute; top:0; bottom:0; background:var(--accent); border-radius:2px; }
.zeitleiste i.schwach { opacity:.4; }
.tipp.is-warn .zeitleiste i { background:var(--warn); }
.zeitleiste .jetzt { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); border-radius:0; }
.zeitleiste .nacht { position:absolute; top:0; bottom:0; background:repeating-linear-gradient(135deg, transparent 0 3px, var(--hair) 3px 4px); }
.fenster small { display:flex; justify-content:space-between; font-size:10.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
.tipps .leer { padding:14px; color:var(--dim); font-size:14px; }

/* ---- Woche ---- */
.woche { display:grid; }
.w-zeile { display:grid; grid-template-columns:50px 40px 58px minmax(0,1fr) 48px; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--hair); text-align:left; width:100%; }
.w-zeile:last-child { border-bottom:0; }
.w-zeile:hover { background:var(--accent-soft); }
.w-zeile.is-heute .w-tag b { color:var(--accent); }
.w-tag { line-height:1.15; }
.w-tag b { display:block; font-weight:700; font-size:14px; }
.w-tag span { font-size:11.5px; color:var(--dim); }
.w-zeile .sym { width:38px; height:38px; }
.w-regen { font-size:11.5px; color:var(--dim); line-height:1.25; white-space:nowrap; }
.w-regen .ic { display:inline-block; vertical-align:-2px; margin-right:2px; }
.w-regen b { display:block; color:var(--rain); font-weight:700; font-size:13px; }
.w-regen.is-trocken b { color:var(--dim); font-weight:500; }
.w-temp { position:relative; height:28px; display:grid; align-items:center; }
.w-temp .spur { position:absolute; left:34px; right:34px; top:12px; height:4px; background:var(--surface2); border-radius:2px; }
.w-temp .spur i { position:absolute; top:-1px; height:6px; border-radius:3px; background:linear-gradient(90deg, var(--rain), var(--warm)); }
.w-temp .spur .mark { position:absolute; top:-3px; width:2px; height:10px; background:var(--ink); }
.w-temp b, .w-temp span { position:absolute; top:0; line-height:28px; font-size:14px; font-weight:700; font-family:var(--display); }
.w-temp span { left:0; color:var(--dim); font-weight:500; }
.w-temp b { right:0; }
.w-wind { font-size:12px; color:var(--dim); text-align:right; line-height:1.25; }
.w-wind b { display:block; color:var(--ink); font-weight:700; font-size:13px; }
.w-sonne { font-size:11.5px; color:var(--dim); }

/* ---- Himmel: Sonne und Mond ---- */
.zwei { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
@media (max-width: 440px) { .zwei { grid-template-columns:minmax(0,1fr); } }
.tafel { padding:14px 14px 12px; display:grid; gap:10px; align-content:start; }
.tafel h3 { font-size:20px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.tafel h3 span { font-family:var(--sans); font-size:12px; color:var(--dim); font-weight:600; }
.tafel .zeilen { display:grid; gap:0; }
.tafel .z { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:5px 0; border-bottom:1px solid var(--hair); font-size:13.5px; }
.tafel .z:last-child { border-bottom:0; }
.tafel .z span { color:var(--dim); }
.tafel .z b { font-family:var(--display); font-weight:500; font-size:16px; white-space:nowrap; }
.tafel .z b i { font-style:normal; font-family:var(--sans); font-size:11.5px; color:var(--dim); margin-left:3px; }
.mondbild { display:flex; align-items:center; gap:14px; }
.mondbild .sym { width:84px; height:84px; flex:none; }
.mondbild .mtext { display:grid; gap:2px; }
.mondbild .mtext b { font-family:var(--display); font-size:20px; font-weight:500; line-height:1.15; }
.mondbild .mtext span { font-size:12.5px; color:var(--dim); }
.tagbogen { display:grid; gap:2px; }
.tagbogen svg { width:100%; height:64px; overflow:visible; }
.tagbogen small, .windzeile small { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; font-size:10.5px; color:var(--dim); }
.tagbogen small span:nth-child(2), .windzeile small span:nth-child(2) { text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.phasen { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; text-align:center; font-size:11px; color:var(--dim); line-height:1.25; }
.phasen .sym { width:30px; height:30px; margin:0 auto 2px; }
.phasen b { display:block; color:var(--ink); font-weight:700; font-size:12px; }

/* ---- Wind und Luft ---- */
.kompass { display:grid; grid-template-columns:120px minmax(0,1fr); gap:12px; align-items:center; }
.kompass svg { width:120px; height:120px; }
.kompass .kz { display:grid; gap:4px; }
.kompass .kz b { font-family:var(--display); font-size:34px; font-weight:200; line-height:1; }
.kompass .kz b i { font-style:normal; font-family:var(--sans); font-size:12px; font-weight:600; color:var(--dim); margin-left:4px; }
.kompass .kz span { font-size:13px; color:var(--dim); }
.kompass .kz span strong { color:var(--ink); font-weight:700; }
.luftring { display:grid; grid-template-columns:96px minmax(0,1fr); gap:12px; align-items:center; }
.luftring svg { width:96px; height:96px; }
.luftring .lz { display:grid; gap:4px; }
.luftring .lz b { font-family:var(--display); font-size:22px; font-weight:500; line-height:1.15; }
.luftring .lz span { font-size:13px; color:var(--dim); }
.luftring .lz .calima { color:var(--warm); font-weight:700; }
.balken { display:grid; grid-template-columns:52px minmax(0,1fr) 54px; gap:8px; align-items:center; font-size:12px; color:var(--dim); }
.balken .b { height:6px; background:var(--surface2); border-radius:2px; position:relative; overflow:hidden; }
.balken .b i { position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--accent); }
.balken b { color:var(--ink); text-align:right; font-weight:700; }
.windzeile { display:grid; gap:2px; }
.windzeile .std { display:grid; grid-template-columns:repeat(24, minmax(0,1fr)); gap:1px; height:34px; align-items:end; }
.windzeile .std i { display:block; background:var(--accent); opacity:.85; border-radius:1px 1px 0 0; min-height:2px; }
.windzeile .std i.boe { background:var(--surface2); }


/* ---- Karte ---- */
#s-karte { padding-block:30px 0; }
#s-karte > header { padding-inline:16px; max-width:560px; margin:0 auto; width:100%; }
.kartenrahmen { width:100%; max-width:560px; margin:0 auto; border-radius:var(--r); overflow:hidden; border:1px solid var(--border); box-shadow:var(--shadow); }
@media (max-width: 592px) { .kartenrahmen { border-radius:0; border-left:0; border-right:0; } }

/* ---- Fuß ---- */
.fuss { padding-block:26px 40px; font-size:12px; color:var(--dim); line-height:1.6; display:grid; gap:6px; }
.fuss a { color:var(--accent); }

/* ---- Blätter (Orte, Menü, Tag) ---- */
.blatt { position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column; }
.blatt .top { position:relative; padding-top:env(safe-area-inset-top,0px); }
.blatt .top .wrap { min-height:52px; }
.blatt .zurueck { display:flex; align-items:center; gap:2px; font-weight:600; font-size:15px; padding:6px 8px 6px 2px; border-radius:8px; }
.blatt .btitel { flex:1; min-width:0; text-align:center; line-height:1.15; }
.blatt .btitel b { display:block; font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.blatt .btitel span { display:block; font-size:12px; color:var(--dim); }
.blatt .inhalt { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding-bottom:env(safe-area-inset-bottom,0px); }
.blatt .inhalt > .wrap { padding-block:14px 30px; display:grid; gap:14px; }
.blatt .inhalt > .wrap > * { min-width:0; }

/* Orte */
.suche { display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--border); background:var(--surface); border-radius:var(--r); }
.suche .ic { color:var(--dim); width:20px; height:20px; }
.suche input { flex:1; min-width:0; border:0; background:none; color:var(--ink); font:inherit; font-size:16px; padding:6px 0; outline:none; }
.suche input::placeholder { color:var(--dim); }
.liste { display:grid; }
.ort-eintrag { display:grid; grid-template-columns:minmax(0,1fr) auto 44px; gap:10px; align-items:center; padding:10px 6px 10px 14px; border-bottom:1px solid var(--hair); text-align:left; width:100%; }
.ort-eintrag:last-child { border-bottom:0; }
.ort-eintrag:hover { background:var(--accent-soft); }
.ort-eintrag .n { line-height:1.2; min-width:0; }
.ort-eintrag .n b { display:block; font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ort-eintrag .n span { display:block; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ort-eintrag .t { font-family:var(--display); font-size:18px; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.ort-eintrag .t .sym { width:32px; height:32px; }
.ort-eintrag .stern { width:44px; height:44px; display:grid; place-items:center; color:var(--dim); border-radius:8px; }
.ort-eintrag.is-fav .stern { color:var(--warm); }
.ort-eintrag.is-on .n b { color:var(--accent); }

/* Menü */
.menue-gruppe { display:grid; }
.menue-gruppe .eyebrow { padding:0 0 6px; }
.wahl { display:grid; gap:0; }
.wahl button { display:grid; grid-template-columns:minmax(0,1fr) 24px; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--hair); text-align:left; width:100%; }
.wahl button:last-child { border-bottom:0; }
.wahl button:hover { background:var(--accent-soft); }
.wahl button b { display:block; font-weight:600; font-size:15px; }
.wahl button span { display:block; font-size:12px; color:var(--dim); }
.wahl button .ic { color:var(--accent); visibility:hidden; }
.wahl button.is-on .ic { visibility:visible; }
.wahl .schalter { justify-self:end; width:40px; height:24px; border-radius:12px; background:var(--surface2); border:1px solid var(--border); position:relative; }
.wahl .schalter::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--dim); transition:transform .15s; }
.wahl button.is-on .schalter { background:var(--accent); border-color:var(--accent); }
.wahl button.is-on .schalter::after { background:#fff; transform:translateX(16px); }
.menue-text { font-size:13px; color:var(--dim); line-height:1.55; }
.menue-text a { color:var(--accent); }

/* Tag-Blatt */
.tag-kopf { display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:center; padding:14px; }
.tag-kopf .sym { width:72px; height:72px; }
.tag-kopf b { font-family:var(--display); font-size:30px; font-weight:200; line-height:1; }
.tag-kopf b i { font-style:normal; color:var(--dim); font-size:22px; }
.tag-kopf p { margin:2px 0 0; font-size:13.5px; color:var(--dim); }
.stundenliste { display:grid; }
.sz { display:grid; grid-template-columns:44px 36px 44px minmax(0,1fr) 62px; gap:8px; align-items:center; padding:7px 12px; border-bottom:1px solid var(--hair); font-size:13px; }
.sz:last-child { border-bottom:0; }
.sz.is-jetzt { background:var(--accent-soft); }
.sz .h { font-weight:700; }
.sz .sym { width:32px; height:32px; }
.sz .t { font-family:var(--display); font-size:17px; }
.sz .r { color:var(--dim); font-size:12px; line-height:1.25; }
.sz .r b { color:var(--rain); font-weight:700; }
.sz .r.is-trocken b { color:var(--dim); font-weight:500; }
.sz .w { text-align:right; color:var(--dim); font-size:12px; display:flex; justify-content:flex-end; align-items:center; gap:4px; }
.sz .w b { color:var(--ink); font-weight:700; }
.sz .w .pfeil { width:14px; height:14px; }

@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* ---- css/diagramm.css ---- */
/* Zenit – Verlauf (Meteogramm): Ablese-Fahne, wischbares Diagramm mit Auswahl-Strich in der Mitte, Knöpfe. */
#s-verlauf { padding-block:30px 6px; gap:10px; }
#s-verlauf > header { padding-inline:16px; max-width:560px; margin:0 auto; width:100%; }
.v-wrap { max-width:560px; margin:0 auto; width:100%; }
.v-fahne { position:sticky; top:calc(94px + env(safe-area-inset-top,0px)); z-index:5; display:grid; gap:6px;
  padding:10px 14px 10px; background:var(--surface); border:1px solid var(--border); border-bottom:0; border-radius:var(--r) var(--r) 0 0; box-shadow:var(--shadow); }
.v-fahne .kopf { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.v-fahne .zeit { font-family:var(--display); font-size:21px; font-weight:500; line-height:1.05; white-space:nowrap; }
.v-fahne .zeit small { display:block; font-family:var(--sans); font-size:12px; font-weight:600; color:var(--dim); margin-top:2px; }
.v-fahne .lage { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--dim); text-align:right; min-width:0; }
.v-fahne .lage .sym { width:30px; height:30px; flex:none; }
.v-fahne .lage b { color:var(--ink); font-weight:600; }
.v-fahne .werte { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:4px 10px; font-size:11px; color:var(--dim); line-height:1.3; padding-top:6px; border-top:1px solid var(--hair); }
.v-fahne .werte > div { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.v-fahne .werte b { display:block; color:var(--ink); font-weight:700; font-size:13.5px; }
.v-fahne .werte b i { font-style:normal; font-weight:600; color:var(--dim); font-size:11px; margin-left:1px; }
.v-fahne .zweit { font-size:12px; color:var(--dim); padding-top:6px; border-top:1px solid var(--hair); }
.v-fahne .zweit b { color:var(--warm); font-weight:700; }
.v-body { position:relative; background:var(--surface); border:1px solid var(--border); border-top:0; border-radius:0 0 var(--r) var(--r); overflow:hidden; box-shadow:var(--shadow); }
.v-scroll { overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; touch-action:pan-x pan-y; }
.v-scroll::-webkit-scrollbar { display:none; }
.v-svg { display:block; }
.v-cursor { position:absolute; top:0; bottom:0; left:50%; width:0; border-left:1.5px solid var(--ink); opacity:.8; pointer-events:none; }
.v-cursor::before { content:""; position:absolute; top:0; left:-5px; border:4px solid transparent; border-top:6px solid var(--ink); }
.v-achse { position:absolute; left:0; top:0; bottom:0; width:40px; pointer-events:none; }
.v-achse .ax-titel { position:absolute; left:0; padding:2px 8px 2px 8px; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); background:color-mix(in srgb, var(--surface) 88%, transparent); border-radius:0 6px 6px 0; white-space:nowrap; }
.v-achse .ax-tick { position:absolute; right:6px; font-size:10.5px; color:var(--dim); line-height:12px; font-variant-numeric:tabular-nums; }
.v-tage { position:sticky; top:0; }
.v-knoepfe { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 0 0; flex-wrap:wrap; }
.v-btn { min-height:40px; min-width:40px; padding:0 12px; border:1px solid var(--border); background:var(--surface); border-radius:8px; font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; }
.v-btn:hover { background:var(--accent-soft); }
.v-btn.is-akzent { border-color:var(--accent); color:var(--accent); }
.v-btn.is-on { background:var(--accent-soft); border-color:var(--accent); color:var(--ink); }
.v-btn .ic { width:18px; height:18px; }
.v-legende { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; padding:8px 16px 0; font-size:11.5px; color:var(--dim); }
.v-legende i { display:inline-block; width:14px; height:0; border-top:2px solid; vertical-align:middle; margin-right:5px; border-radius:1px; }
.v-legende i.gestrichelt { border-top-style:dashed; }
.v-legende i.block { height:9px; border:0; opacity:.85; }
.v-hinweis { text-align:center; font-size:11.5px; color:var(--dim); padding:8px 16px 0; }

/* ---- ../gemeinsam/wpkarte.css ---- */
/* WetterKarte – gemeinsamer Kartenbaustein (Reiter „Karten" und „Rad/Sat").
   Farben über Variablen, Vorgabe = WeatherPro-Blau. Eine App setzt die --wk-* am Container oder an :root um. */
.wk {
  --wk-leiste: var(--kopf, #0f4a94);        /* Ebenenleiste rechts */
  --wk-leiste-an: var(--hell, #2069c4);     /* aktiver Knopf */
  --wk-zeit: var(--leiste, #0c2e5c);        /* Zeitleiste unten */
  --wk-text: #fff;
  --wk-still: var(--dim, #c6d5ea);
  --wk-akzent: var(--gelb, #ffd633);
  --wk-rand: var(--linie, rgba(255,255,255,.22));
  --wk-hoehe: calc(100dvh - 190px);
  display: flex; flex-direction: column; height: var(--wk-hoehe); min-height: 340px; color: var(--wk-text);
  font-variant-numeric: tabular-nums; position: relative;
}
.wk-oben { flex: 1; min-height: 0; display: flex; }
.wk-karte { flex: 1; min-width: 0; position: relative; background: #7fa7c9; }
.wk-karte .leaflet-container { width: 100%; height: 100%; background: #7fa7c9; font: inherit; }
.wk-karte .leaflet-container a { color: inherit; }

/* Ebenenleiste rechts */
.wk-leiste { width: 56px; flex: none; display: flex; flex-direction: column; background: var(--wk-leiste); border-left: 0.5px solid var(--wk-rand); overflow-y: auto; scrollbar-width: none; }
.wk-leiste::-webkit-scrollbar { display: none; }
.wk-knopf { width: 56px; height: 52px; flex: none; border: 0; border-bottom: 0.5px solid var(--wk-rand); background: none; display: grid; place-items: center; cursor: pointer; color: var(--wk-still); -webkit-tap-highlight-color: transparent; }
.wk-knopf svg { width: 26px; height: 26px; display: block; }
.wk-knopf.is-on { background: var(--wk-leiste-an); color: var(--wk-text); }
.wk-knopf:disabled { opacity: .35; cursor: default; }
.wk-knopf:focus-visible { outline: 2px solid var(--wk-akzent); outline-offset: -3px; }
.wk-trenner { flex: 1; min-height: 8px; }

/* Zeitleiste unten */
.wk-zeit { background: var(--wk-zeit); padding: 6px 10px 10px; border-top: 0.5px solid var(--wk-rand); }
.wk-regler { display: flex; align-items: center; gap: 2px; }
.wk-tk { width: 40px; height: 40px; border: 0; background: none; color: var(--wk-text); display: grid; place-items: center; cursor: pointer; flex: none; -webkit-tap-highlight-color: transparent; }
.wk-tk svg { width: 18px; height: 18px; display: block; }
.wk-tk:disabled { opacity: .35; }
.wk-spur { flex: 1; min-width: 0; position: relative; padding: 0 2px 30px; }
.wk-range { width: 100%; margin: 0; display: block; accent-color: #fff; height: 28px; }
.wk-ticks { position: absolute; left: 10px; right: 10px; bottom: 16px; height: 14px; font-size: 10.5px; color: var(--wk-still); pointer-events: none; }
.wk-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.wk-ticks span::before { content: ""; display: block; width: 0.5px; height: 4px; background: var(--wk-still); margin: 0 auto 1px; }
.wk-tage { position: absolute; left: 10px; right: 10px; bottom: 0; height: 14px; font-size: 11px; font-weight: 600; color: var(--wk-text); pointer-events: none; }
.wk-tage span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.wk-tage span.is-heute { color: var(--wk-akzent); }
.wk-lade { position: absolute; right: 8px; top: 44px; z-index: 500; font-size: 11.5px; color: var(--wk-still); background: rgba(0,0,0,.45); padding: 2px 7px; pointer-events: none; }

/* Marken */
.wk-mk { background: none; border: 0; }
.wk-marke { position: absolute; left: 0; top: 0; font-size: 12.5px; line-height: 1.15; white-space: nowrap; color: #fff;
  text-shadow: 0 0 3px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.7); pointer-events: none; }
.wk-marke i { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 0.5px solid rgba(0,0,0,.6); box-shadow: 0 0 3px rgba(0,0,0,.6); }
.wk-marke .wk-name { position: absolute; left: 8px; top: -8px; font-weight: 500; }
.wk-marke .wk-w { position: absolute; right: 7px; top: -34px; display: flex; align-items: center; gap: 1px; }
.wk-marke .wk-w svg { width: 34px; height: 34px; display: block; filter: drop-shadow(0 0 2px rgba(0,0,0,.9)); }
.wk-marke .wk-w b { font-size: 14px; font-weight: 500; }
.wk-marke.is-hier i { width: 12px; height: 12px; left: -6px; top: -6px; background: var(--wk-akzent); box-shadow: 0 0 0 3px rgba(255,214,51,.3); }
.wk-marke.is-hier .wk-name { color: var(--wk-akzent); font-weight: 600; font-size: 13.5px; }
.wk-marke.is-hier .wk-w { top: -38px; }
.wk-marke.is-hier .wk-w svg { width: 40px; height: 40px; }
.wk-marke.is-hier .wk-w b { font-size: 16px; }
.wk-ohne-wetter .wk-marke .wk-w { display: none; }

/* Flächen und Bilder */
.wk-flaeche { image-rendering: auto; }
.wk-basis-bild { image-rendering: auto; }

/* Quellen, Hinweise, Legende */
.wk-quelle { position: absolute; left: 6px; right: 6px; bottom: 4px; z-index: 500; font-size: 10px; line-height: 1.25; letter-spacing: .04em; color: rgba(255,255,255,.85); text-shadow: 0 0 3px rgba(0,0,0,.95); pointer-events: none; }
.wk-hinweis { position: absolute; left: 12px; right: 12px; bottom: 22px; z-index: 500; text-align: center; font-size: 12.5px; line-height: 1.4; color: #fff; padding: 6px 10px; background: rgba(11,26,46,.8); pointer-events: none; }
.wk-legende { position: absolute; left: 6px; top: 6px; z-index: 500; font-size: 10.5px; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.95); pointer-events: none; display: flex; align-items: center; gap: 6px; }
.wk-legende i { display: block; width: 110px; height: 8px; border: 0.5px solid rgba(0,0,0,.5); }
.wk-titel { position: absolute; right: 6px; top: 6px; z-index: 500; font-size: 11px; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.95); pointer-events: none; text-align: right; line-height: 1.25; }
.wk-titel b { display: block; font-size: 12.5px; }

/* Leaflet-Feinheiten */
.wk .leaflet-control-attribution { display: none; }
.wk .leaflet-marker-icon { transition: none; }
.wk .leaflet-image-layer { pointer-events: none; }

/* ---- css/karten.css ---- */
/* Zenit – Bereiche „Karten" und „Rad/Sat": der gemeinsame Kartenbaustein (.wk) im Zenit-Kleid.
   Der Rahmen (.kartenrahmen) steht in zenit.css: breit ein Kasten mit sanften Ecken, am Handy randlos. */

/* Überschrift mit Zeitangabe rechts */
.k-kopfzeile { display:flex; justify-content:space-between; align-items:baseline; gap:12px; min-width:0; }
.k-kopfzeile h2 { min-width:0; }
.k-zeit { flex:none; font-size:12.5px; font-weight:600; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
.k-zeit:empty { display:none; }

/* Baustein in Zenit-Farben: Leiste und Zeitleiste wie Zenits Flächen, Akzent Türkis, hell und dunkel über die Token */
.kartenrahmen.wk {
  --wk-leiste: var(--surface);
  --wk-leiste-an: var(--accent-soft);
  --wk-zeit: var(--surface2);
  --wk-text: var(--ink);
  --wk-still: var(--dim);
  --wk-akzent: var(--accent);
  --wk-rand: var(--hair);
  --wk-hoehe: clamp(440px, 64dvh, 640px);
  color: var(--ink);
}
@supports not (height: 100dvh) { .kartenrahmen.wk { --wk-hoehe: clamp(440px, 64vh, 640px); } }
.kartenrahmen.wk .wk-knopf.is-on { color:var(--accent); }
.kartenrahmen.wk .wk-range { accent-color:var(--accent); }
.kartenrahmen.wk .wk-marke.is-hier i { box-shadow:0 0 0 3px var(--accent-soft); }
/* Marken und Beschriftungen liegen auf der Karte – dort bleibt Weiß mit Schatten, unabhängig vom Thema */
.kartenrahmen.wk .wk-karte { color:#fff; }

</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="wrap">
      <button type="button" class="marke" id="k-marke" aria-label="Nach oben">Zen<i>it</i></button>
      <button type="button" class="ortwahl" id="k-ort" aria-label="Ort wechseln"><b id="k-ortname">–</b><span id="k-region"></span></button>
      <button type="button" class="ik" id="k-menue" aria-label="Menü"></button>
    </div>
    <nav class="nav wrap" id="nav" aria-label="Bereiche"></nav>
  </header>
  <div class="hinweisleiste" id="snapshot-hinweis" hidden></div>
  <main class="screen" id="screen">
    <section class="held" id="s-jetzt" data-nav="Jetzt"><div class="laden">Zenit holt das Wetter …</div></section>
    <section class="block wrap" id="s-heute" data-nav="Heute"></section>
    <section class="block" id="s-verlauf" data-nav="Verlauf"></section>
    <section class="block wrap" id="s-woche" data-nav="Woche"></section>
    <section class="block wrap" id="s-himmel" data-nav="Himmel"></section>
    <section class="block wrap" id="s-luft" data-nav="Wind &amp; Luft"></section>
    <section class="block" id="s-karten" data-nav="Karten"></section>
    <section class="block" id="s-radsat" data-nav="Rad/Sat"></section>
    <footer class="fuss wrap" id="fuss"></footer>
  </main>
</div>
<script>
/* ---- js/symbole.js ---- */
/* Zenit – farbige Wettersymbole, Mondscheibe, Luftring, Windrose und Strichzeichen. */
(function (global) {
  'use strict';
  var WP = global.WP = global.WP || {};

  // ---- Farbige Symbole nach WeatherPro-Vorbild ----
  // Verläufe und Filter einmal in die Seite legen, alle Symbole verweisen darauf.
  var DEFS = '<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="wp-defs"><defs>' +
    '<linearGradient id="wpg-wolke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f4f6f8"/><stop offset="1" stop-color="#cfd6de"/></linearGradient>' +
    '<linearGradient id="wpg-wolke2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e8ee"/><stop offset="1" stop-color="#aab4bf"/></linearGradient>' +
    '<radialGradient id="wpg-sonne" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3a8"/><stop offset=".6" stop-color="#ffd83a"/><stop offset="1" stop-color="#f7c21e"/></radialGradient>' +
    '<radialGradient id="wpg-mond" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#f2f4f6"/><stop offset=".7" stop-color="#c4cbd3"/><stop offset="1" stop-color="#9ea8b3"/></radialGradient>' +
    '<linearGradient id="wpg-tropfen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#3f8fe0"/></linearGradient>' +
    '<filter id="wpf-glut" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>' +
    '<filter id="wpf-schatten" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity=".35"/></filter>' +
    '<clipPath id="wpc-mond"><circle cx="32" cy="32" r="15"/></clipPath>' +
    '<radialGradient id="wpg-mond2" gradientUnits="userSpaceOnUse" cx="26" cy="26" r="24"><stop offset="0" stop-color="#f2f4f6"/><stop offset=".7" stop-color="#c4cbd3"/><stop offset="1" stop-color="#9ea8b3"/></radialGradient>' +
    '</defs></svg>';
  function defsSichern() {
    if (document.body && !document.getElementById('wp-defs')) document.body.insertAdjacentHTML('afterbegin', DEFS);
  }
  if (document.body) defsSichern(); else document.addEventListener('DOMContentLoaded', defsSichern);

  // Zwölfzackige Sonne wie im Original: Stern aus 12 Spitzen, gelb mit orangem Rand und Schein.
  function sonne(cx, cy, sc) {
    var pts = [];
    for (var i = 0; i < 24; i++) {
      var a = i * Math.PI / 12 - Math.PI / 2, r = (i % 2 === 0) ? 29 : 17;
      pts.push((cx + Math.cos(a) * r * sc).toFixed(1) + ',' + (cy + Math.sin(a) * r * sc).toFixed(1));
    }
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (24 * sc).toFixed(1) + '" fill="#ffd83a" opacity=".55" filter="url(#wpf-glut)"/>' +
      '<polygon points="' + pts.join(' ') + '" fill="url(#wpg-sonne)" stroke="#e9a516" stroke-width="1" stroke-linejoin="round"/>';
  }
  var WOLKE_PFAD = 'M16 52H46A11 11 0 0 0 46 30A14 14 0 0 0 19 27A12.5 12.5 0 0 0 16 52Z';
  function wolke(dx, dy, sc, hinten) {
    return '<path transform="translate(' + dx + ' ' + dy + ') scale(' + sc + ')" d="' + WOLKE_PFAD + '" fill="url(#' + (hinten ? 'wpg-wolke2' : 'wpg-wolke') + ')" stroke="' + (hinten ? '#98a3ae' : '#aab4be') + '" stroke-width="1" stroke-linejoin="round" filter="url(#wpf-schatten)"/>';
  }
  function mond(dx, dy, sc) {
    return '<g transform="translate(' + dx + ' ' + dy + ') scale(' + sc + ')"><circle cx="32" cy="32" r="15" fill="url(#wpg-mond)" stroke="#8e98a3" stroke-width=".8"/>' +
      '<circle cx="41" cy="27" r="14.5" fill="#2b5b9b" opacity=".88" clip-path="url(#wpc-mond)"/></g>';
  }
  var TROPFEN_PFAD = 'M0 0c3 4 4.5 6.5 4.5 8.6a4.5 4.5 0 0 1-9 0C-4.5 6.5-3 4 0 0z';
  function tropfen(y) {
    return [22, 32, 42].map(function (x, i) {
      return '<path transform="translate(' + x + ' ' + (y + (i === 1 ? 3 : 0)) + ') rotate(12)" d="' + TROPFEN_PFAD + '" fill="url(#wpg-tropfen)" stroke="#2f7cc9" stroke-width=".7"/>';
    }).join('');
  }
  var BLITZ = '<path d="M35 38l-9 15h6.5l-3.5 11 11-16h-6.5l4.5-10z" fill="#ffd83a" stroke="#e08a10" stroke-width=".9" stroke-linejoin="round"/>';
  var NEBEL = '<g stroke="#c9d1da" stroke-width="3" stroke-linecap="round"><line x1="12" y1="34" x2="52" y2="34"/><line x1="16" y1="42" x2="48" y2="42"/><line x1="20" y1="50" x2="44" y2="50"/></g>';
  function flocke(x, y) {
    return '<g transform="translate(' + x + ' ' + y + ')" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M0-4.5v9M-3.9-2.25l7.8 4.5M-3.9 2.25l7.8-4.5"/></g>';
  }
  var SCHNEE = flocke(22, 53) + flocke(33, 57) + flocke(44, 53);

  var ARTEN = {
    sonne:       function () { return sonne(32, 32, 1); },
    sonnewolke:  function () { return sonne(41, 22, 0.72) + wolke(-2, 3, 0.95); },
    wolke:       function () { return wolke(0, -1, 1); },
    bedeckt:     function () { return wolke(10, -9, 0.78, true) + wolke(-3, 3, 0.98); },
    regen:       function () { return wolke(0, -10, 1) + tropfen(46); },
    schauer:     function () { return sonne(42, 17, 0.62) + wolke(-2, -8, 0.95) + tropfen(47); },

    schnee:      function () { return wolke(0, -10, 1) + SCHNEE; },

    mondwolke:   function () { return mond(8, -5, 0.78) + wolke(2, 6, 0.82); },

  WP.symbol = function (art) {
    var f = ARTEN[art] || ARTEN.wolke;
    return '<svg viewBox="0 0 64 64" class="sym sym-' + art + '" aria-hidden="true">' + f() + '</svg>';
  };

  // Mond mit echter Phase: anteil 0..1 beleuchtet, zunehmend = rechte Seite hell (Nordhalbkugel)
  WP.mondSymbol = function (anteil, zunehmend) {
    var r = 15, dunkel = '#0c1626', hell = 'url(#wpg-mond2)';
    var rx = Math.abs(1 - 2 * anteil) * r;
    var halb = 'M32 17A15 15 0 0 ' + (zunehmend ? '1' : '0') + ' 32 47Z';
    // Krater als zarte Ringe, damit die Scheibe nach Mond aussieht
    var krater = '<g fill="rgba(0,0,0,.10)" stroke="rgba(0,0,0,.14)" stroke-width=".6">' +

    return '<svg viewBox="0 0 64 64" class="sym sym-mondphase" aria-hidden="true">' +
      '<circle cx="32" cy="32" r="' + r + '" fill="' + hell + '"/>' + krater +
      '<g clip-path="url(#wpc-mond)"><rect x="0" y="0" width="64" height="64" fill="' + dunkel + '" opacity=".93"/>' +
      '<path d="' + halb + '" fill="' + hell + '"/>' +
      '<ellipse cx="32" cy="32" rx="' + rx.toFixed(2) + '" ry="' + r + '" fill="' + (anteil < 0.5 ? dunkel : hell) + '"' + (anteil < 0.5 ? ' opacity=".93"' : '') + '/>' +
      (anteil >= 0.5 ? '' : '') + '</g>' +
      '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="rgba(255,255,255,.35)" stroke-width=".8"/></svg>';
  };

  // Luftqualität: Ring, der sich mit dem Index füllt (0–100), in der Farbe der Stufe, Zahl in der Mitte
  WP.luftSymbol = function (aqi) {
    var st = WP.luftStufe(aqi), r = 13, U = 2 * Math.PI * r;
    var anteil = aqi == null ? 0 : Math.max(0.04, Math.min(1, aqi / 100));
    return '<svg viewBox="0 0 32 32" class="sym sym-luft" aria-hidden="true">' +
      '<circle cx="16" cy="16" r="' + r + '" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3"/>' +
      (aqi == null ? '' : '<circle cx="16" cy="16" r="' + r + '" fill="none" stroke="' + st.farbe + '" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + (U * anteil).toFixed(1) + ' ' + U.toFixed(1) + '" transform="rotate(-90 16 16)"/>') +
      '<text x="16" y="20" text-anchor="middle" font-size="11" font-family="-apple-system, Helvetica, Arial, sans-serif" fill="#fff">' + (aqi == null ? '–' : Math.round(aqi)) + '</text></svg>';
  };

  // Kompassring mit Pfeil. Open-Meteo gibt an, woher der Wind kommt;
  // der Pfeil zeigt, wohin er weht (wie in WeatherPro).
  WP.windrose = function (deg) {
    var d = (deg == null ? 0 : deg) + 180;
    return '<svg viewBox="0 0 32 32" class="windrose" aria-hidden="true">' +
      '<circle cx="16" cy="16" r="12.5" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.4" stroke-dasharray="3.5 4"/>' +
      '<path d="M16 4.5 21 19.5 16 16.5 11 19.5Z" fill="#fff" transform="rotate(' + d + ' 16 16)"/></svg>';
  };

    // Ebenen-Leiste der Karte
    eb_wetter:   ic('<circle cx="8.5" cy="8.5" r="3"/><path d="M8.5 3v1.2M8.5 12.8V14M3 8.5h1.2M12.8 8.5H14"/><path d="M11 21h7.5a3.2 3.2 0 0 0 .3-6.4A4.8 4.8 0 0 0 9.6 13 4 4 0 0 0 11 21z"/>'),

    // Zenit: Zeichen für „Was heute geht“, Menü, Pfeile
